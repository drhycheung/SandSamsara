  update(engine, figures, samsara) {
    const cw = engine.w * CONFIG.grid.cellSize;
    const ch = engine.h * CONFIG.grid.cellSize;
    this.maxRadius = Math.sqrt(cw*cw + ch*ch) / 2;

    if (!this.active) return;

    this.rotation += 0.03;

    // Spawning growth
    if (this.state === "spawning") {
      this.radius = lerp(this.radius, this.targetRadius, 0.05);
      if (this.radius > this.targetRadius - 2) {
        this.radius = this.targetRadius;
        this.state = "active";
      }
    }

    // Drag
    if (this.isDragging) {
      this.dragTimer = 120;
    } else if (this.dragTimer > 0) {
      this.dragTimer--;
    }

    // Auto-wander (slows as wheel grows)
    if (!this.isDragging && this.dragTimer <= 0 && this.state === "active") {
      if (this.wanderPause > 0) {
        this.wanderPause--;
      } else {
        const dx = this.wanderTarget.x - this.x;
        const dy = this.wanderTarget.y - this.y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d < 10) {
          this.wanderTarget.x = randRange(cw*0.08, cw*0.92);
          this.wanderTarget.y = randRange(ch*0.1, ch*0.75);
          this.wanderPause = randRange(60, 180);
        } else {
          const speed = CONFIG.fireWheel.wanderSpeed * (1 - this.radius / this.maxRadius * 0.7);
          this.x += (dx/d) * speed;
          this.y += (dy/d) * speed;
        }
      }
    }

    // Active: endless growth + capture (figures orbit, do NOT die)
    if (this.state === "active") {
      this.targetRadius = Math.min(this.maxRadius, this.targetRadius + 0.08);
      this.radius = lerp(this.radius, this.targetRadius, 0.03);

      const detectR = this.radius + 40;
      const detectR2 = detectR * detectR;
      for (const fig of figures) {
        if (fig.dead || fig.liberated || fig.isLiberating || fig.captured) continue;
        const d2 = dist2(this.x, this.y, fig.x, fig.y);
        if (d2 < detectR2) {
          const d = Math.sqrt(d2);
          const force = 40 / (d + 10);
          fig.x += (this.x - fig.x) / d * force;
          fig.y += (this.y - fig.y) / d * force;
          fig.fearLevel = 1;
          fig.beingPulled = true;
          fig.pullX = this.x;
          fig.pullY = this.y;
          fig.pullAmount = Math.min(1, 1.2 - d / detectR);
          // capture: figure orbits at the wheel's outer edge
          if (d < this.radius * 0.9) {
            fig.captured = true;
            fig.capturedBy = this;   // remember WHICH wheel holds this soul
            fig.captureAngle = Math.atan2(fig.y - this.y, fig.x - this.x);
            fig.captureOffset = 0.92 + Math.random() * 0.14;
            fig.captureRadius = this.radius * fig.captureOffset;
            fig.captureSpeed = 0.015 + Math.random() * 0.02; // same direction as wheel
            this.absorbedCount++;
            this.targetRadius = Math.min(this.maxRadius, this.targetRadius + CONFIG.fireWheel.growthPerAbsorb);
          }
        }
      }
    }

    // Rotate captured figures around THEIR OWN wheel (stay at outer edge)
    for (const fig of figures) {
      if (fig.captured && fig.capturedBy === this) {
        // safety: if the holding wheel is gone/spent, release the soul
        if (!this.active || this.radius < 3) {
          fig.captured = false;
          fig.capturedBy = null;
          fig.beingPulled = false;
          fig.pullAmount = 0;
          continue;
        }
        fig.captureAngle += fig.captureSpeed;
        fig.captureRadius = this.radius * (fig.captureOffset || 0.95);
        fig.x = this.x + Math.cos(fig.captureAngle) * fig.captureRadius;
        fig.y = this.y + Math.sin(fig.captureAngle) * fig.captureRadius;
        fig.pullAmount = 1;
        fig.beingPulled = true;
        fig.pullX = this.x;
        fig.pullY = this.y;
      }
    }

    // Edge fire when large
    if (this.radius > CONFIG.fireWheel.edgeFireThreshold && this.state === "active" && chance(0.08)) {
      const edge = rand(4);
      let ex, ey;
      if (edge === 0) { ex = rand(engine.w); ey = 0; }
      else if (edge === 1) { ex = rand(engine.w); ey = engine.h - 1; }
      else if (edge === 2) { ex = 0; ey = rand(engine.h); }
      else { ex = engine.w - 1; ey = rand(engine.h); }
      if (engine.get(ex, ey) === P.EMPTY) engine.set(ex, ey, P.FIRE);
    }

    // Explosion when wheel fills the screen
    if (this.state === "active" && this.radius >= this.maxRadius * 0.95) {
      this.state = "exploding";
      samsara.triggerExplosion(this.x, this.y);
    }

    // Flame particles (more as wheel grows)
    if (this.active && this.radius > 5) {
      const count = Math.min(10, 2 + Math.floor(this.radius / 50));
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const r = this.radius * (0.6 + Math.random() * 0.4);
        this.flameParticles.push({
          x: this.x + Math.cos(ang) * r,
          y: this.y + Math.sin(ang) * r,
          vx: Math.cos(ang) * 0.5 + randRange(-0.3,0.3),
          vy: Math.sin(ang) * 0.5 + randRange(-0.3,0.3) - 0.5,
          life: 20 + rand(20),
          maxLife: 40,
        });
      }
    }
    for (let i = this.flameParticles.length - 1; i >= 0; i--) {
      const p = this.flameParticles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) this.flameParticles.splice(i, 1);
    }
  }

  render(ctx) {
    if (!this.active || this.radius < 2) return;
    ctx.save();

    // Glow layers
    for (let i = 5; i > 0; i--) {
      const r = this.radius * (1 + i * 0.15);
      const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, r);
      grad.addColorStop(0, "rgba(255,60,0,0)");
      grad.addColorStop(0.5, `rgba(255,100,0,${0.06 * i})`);
      grad.addColorStop(1, "rgba(255,30,0,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(this.x - r, this.y - r, r*2, r*2);
    }

    // Core glow
    const coreGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius * 0.45);
    coreGrad.addColorStop(0, "rgba(255,255,220,0.95)");
    coreGrad.addColorStop(0.3, "rgba(255,180,40,0.7)");
    coreGrad.addColorStop(0.7, "rgba(255,80,0,0.3)");
    coreGrad.addColorStop(1, "rgba(255,30,0,0)");
    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius * 0.45, 0, Math.PI*2);
    ctx.fill();

    const rot = this.rotation;
    const rot2 = -this.rotation * 0.6; // counter-rotating inner layer
    const R = this.radius;

    // === Outer jagged rim (32-point flame star) ===
    ctx.strokeStyle = "rgba(255,90,0,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let a = 0; a <= 32; a++) {
      const ang = rot * 0.5 + (a / 32) * Math.PI * 2;
      const r = R * (a % 2 === 0 ? 1.0 : 0.93);
      const px = this.x + Math.cos(ang) * r;
      const py = this.y + Math.sin(ang) * r;
      if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // === Outer thick ring ===
    ctx.strokeStyle = "rgba(255,110,20,0.75)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(this.x, this.y, R * 0.88, 0, Math.PI*2);
    ctx.stroke();

    // === Outer ring tick marks (32) ===
    ctx.strokeStyle = "rgba(255,160,40,0.5)";
    ctx.lineWidth = 1.5;
    for (let a = 0; a < 32; a++) {
      const ang = rot + (a / 32) * Math.PI * 2;
      const r1 = R * 0.88, r2 = R * (a % 4 === 0 ? 0.80 : 0.84);
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(ang)*r1, this.y + Math.sin(ang)*r1);
      ctx.lineTo(this.x + Math.cos(ang)*r2, this.y + Math.sin(ang)*r2);
      ctx.stroke();
    }

    // === 16 main spokes ===
    ctx.strokeStyle = "rgba(255,130,10,0.7)";
    ctx.lineWidth = 2;
    for (let s = 0; s < 16; s++) {
      const ang = rot + s * Math.PI / 8;
      const innerR = R * 0.22;
      const outerR = R * (s % 2 === 0 ? 0.82 : 0.75);
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(ang)*innerR, this.y + Math.sin(ang)*innerR);
      ctx.lineTo(this.x + Math.cos(ang)*outerR, this.y + Math.sin(ang)*outerR);
      ctx.stroke();
    }

    // === Middle ring ===
    ctx.strokeStyle = "rgba(255,100,0,0.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, R * 0.6, 0, Math.PI*2);
    ctx.stroke();

    // === 8 secondary spokes (counter-rotating, between main spokes) ===
    ctx.strokeStyle = "rgba(255,170,60,0.45)";
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 8; s++) {
      const ang = rot2 + s * Math.PI / 4 + Math.PI/8;
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(ang)*R*0.25, this.y + Math.sin(ang)*R*0.25);
      ctx.lineTo(this.x + Math.cos(ang)*R*0.58, this.y + Math.sin(ang)*R*0.58);
      ctx.stroke();
    }

    // === Inner ring ===
    ctx.strokeStyle = "rgba(255,140,30,0.6)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.x, this.y, R * 0.28, 0, Math.PI*2);
    ctx.stroke();

    // === Inner hub: 8-point star ===
    ctx.strokeStyle = "rgba(255,200,80,0.6)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let a = 0; a <= 16; a++) {
      const ang = rot * 1.5 + (a / 16) * Math.PI * 2;
      const r = R * (a % 2 === 0 ? 0.22 : 0.12);
      const px = this.x + Math.cos(ang)*r;
      const py = this.y + Math.sin(ang)*r;
      if (a === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.stroke();

    // === Inner cross ===
    ctx.strokeStyle = "rgba(255,220,120,0.5)";
    ctx.lineWidth = 1.5;
    for (let s = 0; s < 4; s++) {
      const ang = rot * 1.5 + s * Math.PI / 2;
      ctx.beginPath();
      ctx.moveTo(this.x + Math.cos(ang)*R*0.05, this.y + Math.sin(ang)*R*0.05);
      ctx.lineTo(this.x + Math.cos(ang)*R*0.18, this.y + Math.sin(ang)*R*0.18);
      ctx.stroke();
    }

    // === Small hub circles at spoke ends ===
    ctx.fillStyle = "rgba(255,180,50,0.6)";
    for (let s = 0; s < 8; s++) {
      const ang = rot + s * Math.PI / 4;
      ctx.beginPath();
      ctx.arc(this.x + Math.cos(ang)*R*0.6, this.y + Math.sin(ang)*R*0.6, 2, 0, Math.PI*2);
      ctx.fill();
    }

    // Flame particles
    for (const p of this.flameParticles) {
      const alpha = p.life / p.maxLife;
      ctx.fillStyle = `rgba(255,${Math.floor(100 + 100*alpha)},0,${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
      ctx.fill();
    }

    ctx.restore();
  }

  containsPoint(px, py) {
    return this.active && dist2(this.x, this.y, px, py) < this.radius * this.radius;
  }
}

// ============================================================
// 6. SAMSARA CYCLE MANAGER
// ============================================================
class SamsaraManager {
  constructor() {
    this.cycle = 0;
    this.exploding = false;
    this.explosionPhase = 0;
    this.explosionTimer = 0;
    this.explosionX = 0; this.explosionY = 0;
    this.shockwaveRadius = 0;
    this.liberationCount = 0;
    this.totalLiberated = 0;
    this.screenShake = 0;
    this.flashAlpha = 0;
    // gradual respawn after world reset
    this.respawnRemaining = 0;
    this.respawnTimer = 0;
    // 轮回 — every death queues one immediate rebirth elsewhere
    this.rebirthQueue = 0;
    this.figures = [];
  }

  triggerExplosion(x, y) {
    this.exploding = true;
    this.explosionPhase = 0;
    this.explosionTimer = 0;
    this.explosionX = x; this.explosionY = y;
    this.shockwaveRadius = 0;
    this.screenShake = 28;
    this.flashAlpha = 1.5;
  }

  update(engine, figures, wheels) {
    this.figures = figures;

    // 轮回 · Rebirth — a death registered last frame kindles a new soul
    // at once, far from where the old one fell. Population is thus kept
    // constant: nothing truly ends here, it only changes place and form.
    while (this.rebirthQueue > 0) {
      const before = figures.length;
      this.spawnFigure(engine, figures, { rebirth: true });
      if (figures.length === before) break; // no hospitable ground found
      this.rebirthQueue--;
    }

    // Gradual respawn after world reset
    if (this.respawnRemaining > 0 && !this.exploding) {
      this.respawnTimer--;
      if (this.respawnTimer <= 0) {
        this.spawnFigure(engine, figures);
        this.respawnRemaining--;
        this.respawnTimer = 25 + rand(35);
      }
    }

    // Normal spawning (only when not exploding and not in respawn phase)
    if (this.respawnRemaining === 0 &&
        figures.filter(f => !f.dead).length < CONFIG.stickFigures.maxCount &&
        !this.exploding) {
      if (chance(1 / CONFIG.stickFigures.spawnInterval)) {
        this.spawnFigure(engine, figures);
      }
    }

    // Explosion sequence
    if (this.exploding) {
      this.updateExplosion(engine, figures, wheels);
    }

    // Decay effects
    this.screenShake *= 0.88;
    this.flashAlpha *= 0.9;
  }

  updateExplosion(engine, figures, wheels) {
    const phases = CONFIG.explosion.phases;
    this.explosionTimer++;

    if (this.explosionPhase === 0) {
      // implosion — wheel collapses, intense brightening
      this.screenShake = Math.max(this.screenShake, 20);
      if (this.explosionTimer > phases.implosion) {
        this.explosionPhase = 1;
        this.explosionTimer = 0;
        this.flashAlpha = 2;
        this.screenShake = 35;
        // captured figures perish
        for (const fig of figures) {
          if (fig.captured) { fig.captured = false; fig.capturedBy = null; fig.die(engine); }
        }
        // massive initial blast
        const cs = CONFIG.grid.cellSize;
        engine.explode(Math.floor(this.explosionX/cs), Math.floor(this.explosionY/cs), 14);
      }
    } else if (this.explosionPhase === 1) {
      // blast wave — expanding destruction; shake eases off gradually
      this.shockwaveRadius += CONFIG.explosion.shockwaveSpeed * 1.3;
      this.screenShake = Math.max(this.screenShake, 20 - this.explosionTimer * 0.15);
      const cs = CONFIG.grid.cellSize;
      if (this.explosionTimer % 2 === 0) {
        const gr = Math.floor(this.shockwaveRadius / cs);
        const cx = Math.floor(this.explosionX / cs);
        const cy = Math.floor(this.explosionY / cs);
        for (let a = 0; a < 36; a++) {
          const ang = (a/36) * Math.PI*2;
          const px = cx + Math.round(Math.cos(ang) * gr);
          const py = cy + Math.round(Math.sin(ang) * gr);
          if (engine.inBounds(px,py)) {
            const i = engine.idx(px,py);
            if (engine.grid[i] !== P.EMPTY) engine.grid[i] = P.EMPTY;
            if (chance(0.4)) engine.setCell(i, P.FIRE, 25, 200);
          }
        }
      }
      // kill all non-liberated figures in blast
      for (const fig of figures) {
        if (fig.dead || fig.liberated || fig.isLiberating) continue;
        const d = Math.sqrt(dist2(this.explosionX, this.explosionY, fig.x, fig.y));
        if (d < this.shockwaveRadius) {
          fig.health -= 10;
          if (fig.health <= 0) fig.die(engine);
        }
      }
      if (this.explosionTimer > phases.blast) {
        this.explosionPhase = 2;
        this.explosionTimer = 0;
      }
    } else if (this.explosionPhase === 2) {
      // settling — ash rain, fading fire; the world keeps rumbling for
      // several seconds before the reset comes
      this.screenShake = Math.max(this.screenShake, 10 * (1 - this.explosionTimer / phases.settle) + 3);
      if (this.explosionTimer % 4 === 0) {
        const cs = CONFIG.grid.cellSize;
        const ax = rand(engine.w);
        if (engine.get(ax, 0) === P.EMPTY) engine.set(ax, 0, P.ASH);
      }
      if (this.explosionTimer > phases.settle) {
        this.explosionPhase = 3;
        this.explosionTimer = 0;
      }
    } else if (this.explosionPhase === 3) {
      // rebirth — FULL WORLD RESET
      if (this.explosionTimer === 1) {
        this.cycle++;
        this.liberationCount = 0;
        // clear everything
        engine.clear();
        figures.length = 0;
        // rebuild stone floor
        for (let x = 0; x < engine.w; x++) {
          for (let y = engine.h - 3; y < engine.h; y++) {
            engine.set(x, y, P.STONE);
          }
        }
        // reset all fire wheels
        for (const w of wheels) {
          w.active = false;
          w.radius = 0;
          w.targetRadius = 0;
          w.state = "idle";
          w.flameParticles = [];
          w.absorbedCount = 0;
        }
        // gradual respawn
        this.respawnRemaining = 5 + rand(4);
        this.respawnTimer = 45;
      }
      if (this.explosionTimer > phases.rebirth) {
        this.exploding = false;
        this.explosionPhase = 0;
      }
    }
  }

  spawnFigure(engine, figures, opts) {
    const cs = CONFIG.grid.cellSize;
    // find a spot with ground below and empty above
    for (let attempt = 0; attempt < 30; attempt++) {
      const gx = 10 + rand(engine.w - 20);
      // find ground from top
      let gy = 0;
      for (let y = 0; y < engine.h; y++) {
        if (engine.isSolid(engine.get(gx, y))) { gy = y - 3; break; }
      }
      if (gy <= 0) gy = Math.floor(engine.h * 0.4);
      if (engine.get(gx, gy) === P.EMPTY && engine.get(gx, gy+1) === P.EMPTY) {
        const r = Math.random();
        let persona = PERSONAS.APATHETIC;
        const w = CONFIG.stickFigures.personaWeights;
        let cum = 0;
        for (let p = 0; p < w.length; p++) {
          cum += w[p];
          if (r < cum) { persona = p; break; }
        }
        const fig = new StickFigure(gx * cs + cs/2, gy * cs + cs/2, persona);
        if (opts && opts.rebirth) {
          // 投胎 — the newborn carries a faint birth-light for a while
          fig.birthTimer = 60;
          fig.isReborn = true;
        }
        figures.push(fig);
        return;
      }
    }
  }

  renderExplosion(ctx, canvasW, canvasH) {
    if (!this.exploding && this.flashAlpha < 0.01 && this.screenShake < 0.5) return;
    ctx.save();
    // flash — white → gold → orange
    if (this.flashAlpha > 0.01) {
      const fa = Math.min(1, this.flashAlpha);
      const r = Math.floor(lerp(255, 255, fa));
      const g = Math.floor(lerp(180, 248, fa));
      const b = Math.floor(lerp(30, 224, fa));
      ctx.fillStyle = `rgba(${r},${g},${b},${fa * 0.7})`;
      ctx.fillRect(0, 0, canvasW, canvasH);
    }
    // shockwave — double ring
    if (this.exploding && this.explosionPhase >= 1 && this.explosionPhase <= 2) {
      const sr = this.shockwaveRadius;
      // outer glow
      const grad = ctx.createRadialGradient(
        this.explosionX, this.explosionY, Math.max(0, sr - 50),
        this.explosionX, this.explosionY, sr + 50
      );
      grad.addColorStop(0, "rgba(255,220,80,0)");
      grad.addColorStop(0.4, "rgba(255,160,20,0.5)");
      grad.addColorStop(0.7, "rgba(255,80,0,0.3)");
      grad.addColorStop(1, "rgba(255,30,0,0)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(this.explosionX, this.explosionY, sr + 50, 0, Math.PI*2);
      ctx.fill();
      // bright inner ring
      ctx.strokeStyle = `rgba(255,240,180,${Math.max(0, 0.8 - this.explosionTimer/120)})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.arc(this.explosionX, this.explosionY, sr, 0, Math.PI*2);
      ctx.stroke();
      // secondary ring
      ctx.strokeStyle = `rgba(255,140,30,${Math.max(0, 0.5 - this.explosionTimer/150)})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.explosionX, this.explosionY, sr * 0.7, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

// ============================================================
// 7. INPUT HANDLER
// ============================================================
class InputHandler {
  constructor(canvas, game) {
    this.canvas = canvas;
    this.game = game;
    this.mouseX = 0; this.mouseY = 0;
    this.mouseDown = false;
    this.rightDown = false;
    this.draggedFigure = null;
    this.draggedWheel = null;
    this.lastDrawX = 0; this.lastDrawY = 0;

    canvas.addEventListener("mousedown", (e) => this.onDown(e));
    canvas.addEventListener("mousemove", (e) => this.onMove(e));
    canvas.addEventListener("mouseup", (e) => this.onUp(e));
    canvas.addEventListener("mouseleave", () => { this.mouseDown = false; this.rightDown = false; this.onUp({}); });
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    // touch support: single finger paints/drags like a left click
    const touchOpts = { passive: false };
    const firstTouch = (e) => e.changedTouches[0];
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      this.onDown(this.touchPos(firstTouch(e)));
    }, touchOpts);
    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      this.onMove(this.touchPos(firstTouch(e)));
    }, touchOpts);
    canvas.addEventListener("touchend", (e) => {
      e.preventDefault();
      this.mouseDown = false;
      this.onUp({});
    }, touchOpts);
    canvas.addEventListener("touchcancel", () => {
      this.mouseDown = false;
      this.onUp({});
    }, touchOpts);
  }

  // adapt a Touch to the shape of a MouseEvent for onDown/onMove
  touchPos(touch) {
    return { clientX: touch.clientX, clientY: touch.clientY, button: 0 };
  }

  getCanvasPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const scaleX = this.canvas.width / rect.width;
    const scaleY = this.canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY,
    };
  }

  onDown(e) {
    const pos = this.getCanvasPos(e);
    this.mouseX = pos.x; this.mouseY = pos.y;
    this.lastDrawX = pos.x; this.lastDrawY = pos.y;

    if (e.button === 2) {
      this.rightDown = true;
      // right-click cut plant
      this.cutPlant(pos.x, pos.y);
      return;
    }

    this.mouseDown = true;

    // Priority: figure > wheel > canvas
    const fig = this.hitTestFigure(pos.x, pos.y);
    if (fig && !fig.liberated && !fig.isLiberating && !fig.captured) {
      this.draggedFigure = fig;
      fig.isDragged = true;
      fig.dragOffX = pos.x - fig.x;
      fig.dragOffY = pos.y - fig.y;
      return;
    }

    // hit test wheels (topmost / last drawn first)
    for (let i = this.game.wheels.length - 1; i >= 0; i--) {
      const w = this.game.wheels[i];
      if (w.containsPoint(pos.x, pos.y)) {
        this.draggedWheel = w;
        w.isDragging = true;
        return;
      }
    }

    // draw particle
    this.drawParticle(pos.x, pos.y);
  }

  onMove(e) {
    const pos = this.getCanvasPos(e);
    this.mouseX = pos.x; this.mouseY = pos.y;

    if (this.draggedFigure) {
      const f = this.draggedFigure;
      f.x = lerp(f.x, pos.x - f.dragOffX, CONFIG.stickFigures.dragLerp);
      f.y = lerp(f.y, pos.y - f.dragOffY, CONFIG.stickFigures.dragLerp);
      return;
    }

    if (this.draggedWheel) {
      const w = this.draggedWheel;
      w.x = lerp(w.x, pos.x, CONFIG.fireWheel.dragLerp);
      w.y = lerp(w.y, pos.y, CONFIG.fireWheel.dragLerp);
      return;
    }

    if (this.mouseDown) {
      // interpolate drawing
      const dx = pos.x - this.lastDrawX;
      const dy = pos.y - this.lastDrawY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      const steps = Math.max(1, Math.floor(dist / 2));
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        this.drawParticle(
          this.lastDrawX + dx * t,
          this.lastDrawY + dy * t
        );
      }
    }
    this.lastDrawX = pos.x; this.lastDrawY = pos.y;

    if (this.rightDown) {
      this.cutPlant(pos.x, pos.y);
    }
  }

  onUp(e) {
    if (this.draggedFigure) {
      this.draggedFigure.isDragged = false;
      this.draggedFigure.stunTimer = CONFIG.stickFigures.dragStun;
      this.draggedFigure.state = STATES.STUNNED;
      this.draggedFigure = null;
    }
    if (this.draggedWheel) {
      this.draggedWheel.isDragging = false;
      this.draggedWheel = null;
    }
    this.mouseDown = false;
    this.rightDown = false;
  }

  hitTestFigure(x, y) {
    for (const f of this.game.figures) {
      if (f.dead) continue;
      if (Math.abs(x - f.x) < f.bodyW && Math.abs(y - f.y) < f.bodyH) {
        return f;
      }
    }
    return null;
  }

  drawParticle(px, py) {
    const engine = this.game.engine;
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(px / cs);
    const gy = Math.floor(py / cs);
    const r = this.game.brushSize;
    const type = this.game.selectedParticle;
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx*dx + dy*dy > r*r) continue;
        const x = gx + dx, y = gy + dy;
        if (!engine.inBounds(x, y)) continue;
        if (type === P.EMPTY) {
          engine.set(x, y, P.EMPTY);
        } else if (engine.get(x, y) === P.EMPTY) {
          engine.set(x, y, type);
          if (type === P.FIRE) {
            const i = engine.idx(x, y);
            engine.life[i] = 0; engine.temp[i] = 200;
          } else if (type === P.MAGMA) {
            const i = engine.idx(x, y);
            engine.temp[i] = 255;
          }
        }
      }
    }
  }

  cutPlant(px, py) {
    const engine = this.game.engine;
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(px / cs);
    const gy = Math.floor(py / cs);
    const r = Math.max(1, this.game.brushSize);
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        const x = gx+dx, y = gy+dy;
        if (engine.inBounds(x,y) && engine.get(x,y) === P.PLANT) {
          engine.set(x, y, P.ASH);
        }
      }
    }
  }
}

// ============================================================
// 8. UI MANAGER
// ============================================================
class UIManager {
  constructor(game) {
    this.game = game;
    this.toolbar = document.getElementById("toolbar");
    this.hud = document.getElementById("hud");
    this.buildButtons();
  }

  buildButtons() {
    const tb = this.toolbar;
    // Particle buttons
    for (let i = 1; i <= 9; i++) {
      const info = PARTICLE_INFO[i];
      const btn = document.createElement("button");
      btn.className = "btn" + (i === this.game.selectedParticle ? " active" : "");
      btn.innerHTML = `<span class="color-swatch" style="background:${info.color}"></span>${info.name}<span class="btn-label">${info.cn}</span>`;
      btn.addEventListener("click", () => {
        this.game.selectedParticle = i;
        this.updateActiveButtons();
      });
      tb.appendChild(btn);
    }
    // Eraser
    const eraser = document.createElement("button");
    eraser.className = "btn";
    eraser.innerHTML = `Erase<span class="btn-label">擦除</span>`;
    eraser.addEventListener("click", () => {
      this.game.selectedParticle = P.EMPTY;
      this.updateActiveButtons();
    });
    tb.appendChild(eraser);

    // Separator
    const sep = document.createElement("div");
    sep.style.width = "1px"; sep.style.height = "24px"; sep.style.background = "#444";
    tb.appendChild(sep);

    // Brush slider
    const sliderGroup = document.createElement("div");
    sliderGroup.className = "slider-group";
    sliderGroup.innerHTML = `
      <label>Brush 笔刷</label>
      <input type="range" min="1" max="15" value="${this.game.brushSize}" id="brushSlider">
      <span class="slider-val" id="brushVal">${this.game.brushSize}</span>
    `;
    tb.appendChild(sliderGroup);
    this.slider = sliderGroup.querySelector("#brushSlider");
    this.sliderVal = sliderGroup.querySelector("#brushVal");
    this.slider.addEventListener("input", (e) => {
      this.game.brushSize = parseInt(e.target.value);
      this.sliderVal.textContent = this.game.brushSize;
    });

    // Separator
    const sep2 = document.createElement("div");
    sep2.style.width = "1px"; sep2.style.height = "24px"; sep2.style.background = "#444";
    tb.appendChild(sep2);

    // Actions
    const clearBtn = document.createElement("button");
    clearBtn.className = "btn action";
    clearBtn.innerHTML = `Clear<span class="btn-label">清空</span>`;
    clearBtn.addEventListener("click", () => {
      this.game.engine.clear();
      // rebuild stone floor
      const eng = this.game.engine;
      for (let x = 0; x < eng.w; x++) {
        for (let y = eng.h - 3; y < eng.h; y++) {
          eng.set(x, y, P.STONE);
        }
      }
      this.game.figures.length = 0;
      this.game.samsara.liberationCount = 0;
      this.game.samsara.cycle = 0;
      this.game.samsara.exploding = false;
      this.game.samsara.respawnRemaining = 0;
      // reset all fire wheels
      this.game.wheels = [];
    });
    tb.appendChild(clearBtn);

    const wheelBtn = document.createElement("button");
    wheelBtn.className = "btn action";
    wheelBtn.innerHTML = `Wheel<span class="btn-label">火轮</span>`;
    wheelBtn.addEventListener("click", () => {
      const cw = this.game.canvas.width, ch = this.game.canvas.height;
      const w = new FireWheel();
      w.spawn(randRange(cw*0.15, cw*0.85), randRange(ch*0.15, ch*0.7));
      this.game.wheels.push(w);
    });
    tb.appendChild(wheelBtn);

    const spawnBtn = document.createElement("button");
    spawnBtn.className = "btn action";
    spawnBtn.innerHTML = `Soul<span class="btn-label">灵魂</span>`;
    spawnBtn.addEventListener("click", () => {
      this.game.samsara.spawnFigure(this.game.engine, this.game.figures);
    });
    tb.appendChild(spawnBtn);
  }

  updateActiveButtons() {
    const btns = this.toolbar.querySelectorAll(".btn");
    btns.forEach((b, i) => {
      // first 9 are particles, index 9 is eraser
      b.classList.toggle("active",
        (i < 9 && i === this.game.selectedParticle - 1) ||
        (i === 9 && this.game.selectedParticle === P.EMPTY)
      );
    });
  }

  updateHUD() {
    const alive = this.game.figures.filter(f => !f.dead).length;
    const liberated = this.game.totalLiberated + this.game.figures.filter(f => f.liberated).length;
    const activeWheels = this.game.wheels.filter(w => w.active);
    const wheelState = activeWheels.length > 0 ?
      `${activeWheels.length} active` : "idle";
    this.hud.innerHTML = `Cycle <span>${this.game.samsara.cycle}</span> | Souls <span>${alive}</span> | Liberated <span>${liberated}</span> | Wheel <span>${wheelState}</span>`;
  }
}

// ============================================================
// 9. MAIN GAME
// ============================================================
class Game {
  constructor() {
    this.canvas = document.getElementById("gameCanvas");
    this.ctx = this.canvas.getContext("2d");

    // adaptive world size: match the device screen (phones get a smaller
    // sandbox, desktops the full one) while keeping the same cell size
    const cs = CONFIG.grid.cellSize;
    const vw = Math.max(window.innerWidth, 320);
    const vh = Math.max(window.innerHeight, 240);
    CONFIG.grid.width = clamp(Math.round(vw / cs), 180, 560);
    CONFIG.grid.height = clamp(Math.round(vh / cs), 120, 340);
    this.canvas.width = CONFIG.grid.width * cs;
    this.canvas.height = CONFIG.grid.height * cs;

    this.offCanvas = document.createElement("canvas");
    this.offCanvas.width = CONFIG.grid.width;
    this.offCanvas.height = CONFIG.grid.height;
    this.offCtx = this.offCanvas.getContext("2d");

    this.engine = new ParticleEngine(CONFIG.grid.width, CONFIG.grid.height);
    this.figures = [];
    this.wheels = [];
    this.samsara = new SamsaraManager();

    this.selectedParticle = P.SAND;
    this.brushSize = 3;
    this.totalLiberated = 0;

    this.ui = new UIManager(this);
    this.input = new InputHandler(this.canvas, this);

    this.lastTime = 0;
    this.accumulator = 0;
    this.FIXED_DT = 1000 / 60;

    this.resize();
    window.addEventListener("resize", () => this.resize());

    // initial terrain: floor
    for (let x = 0; x < this.engine.w; x++) {
      for (let y = this.engine.h - 3; y < this.engine.h; y++) {
        this.engine.set(x, y, P.STONE);
      }
    }
    // some initial figures
    for (let i = 0; i < 8; i++) {
      this.samsara.spawnFigure(this.engine, this.figures);
    }
  }

  resize() {
    const wrap = document.getElementById("gameWrap");
    const availW = wrap.clientWidth;
    const availH = wrap.clientHeight;
    const cw = this.canvas.width, ch = this.canvas.height;
    const scale = Math.min(availW / cw, availH / ch);
    this.canvas.style.width = (cw * scale) + "px";
    this.canvas.style.height = (ch * scale) + "px";
  }

  update() {
    this.engine.update();

    // Update figures
    for (const f of this.figures) {
      f.update(this.engine, this.wheels, this.samsara);
    }
    // Count liberated this cycle
    const newlyLiberated = this.figures.filter(f => f.liberated && !f._counted);
    for (const f of newlyLiberated) {
      f._counted = true;
      this.samsara.liberationCount++;
      this.totalLiberated++;
    }
    // Remove dead figures
    this.figures = this.figures.filter(f => !f.dead || f.isLiberating);

    for (const w of this.wheels) w.update(this.engine, this.figures, this.samsara);
    // Remove spent wheels
    this.wheels = this.wheels.filter(w => w.active || w.radius > 0);
    this.samsara.update(this.engine, this.figures, this.wheels);
  }

  render() {
    const ctx = this.ctx;
    const cs = CONFIG.grid.cellSize;
    const cw = this.canvas.width, ch = this.canvas.height;

    // Screen shake
    ctx.save();
    if (this.samsara.screenShake > 0.5) {
      ctx.translate(
        randRange(-this.samsara.screenShake, this.samsara.screenShake),
        randRange(-this.samsara.screenShake, this.samsara.screenShake)
      );
    }

    // Clear
    ctx.fillStyle = "#1a1a1a";
    ctx.fillRect(0, 0, cw, ch);

    // Particles (render to offscreen then scale up)
    this.engine.render(this.offCtx);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.offCanvas, 0, 0, cw, ch);

    // Fire wheels
    for (const w of this.wheels) w.render(ctx);

    // Stick figures
    for (const f of this.figures) {
      f.render(ctx);
    }

    // Explosion effects
    this.samsara.renderExplosion(ctx, cw, ch);

    // Brush preview
    if (this.input.mouseX >= 0 && this.input.mouseY >= 0) {
      const bx = this.input.mouseX;
      const by = this.input.mouseY;
      const r = this.brushSize * cs;
      ctx.strokeStyle = "rgba(255,255,255,0.3)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI*2);
      ctx.stroke();
    }

    ctx.restore();

    this.ui.updateHUD();
  }

  loop(timestamp) {
    if (!this.lastTime) this.lastTime = timestamp;
    let dt = timestamp - this.lastTime;
    this.lastTime = timestamp;
    // Guard against speed-up bugs: background tab / long frame spikes
    // would dump huge dt into the accumulator, making every later frame
    // run the max 5 catch-up steps (game visibly races). Clamp instead.
    if (dt < 0) dt = 0;
    if (dt > 100) dt = 100;
    this.accumulator += dt;
    if (this.accumulator > 200) this.accumulator = this.FIXED_DT;

    let steps = 0;
    while (this.accumulator >= this.FIXED_DT && steps < 5) {
      this.update();
      this.accumulator -= this.FIXED_DT;
      steps++;
    }

    this.render();
    requestAnimationFrame((t) => this.loop(t));
  }

  start() {
    requestAnimationFrame((t) => this.loop(t));
  }
}

// ============================================================
// 10. INIT
// ============================================================
window.addEventListener("load", () => {
  const game = window.game = new Game();
  game.start();
});
</script>
