<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沙界轮回 Sand Samsara</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0a0a;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #ccc;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  #gameWrap {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #gameCanvas {
    background: #1a1a1a;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: crosshair;
    box-shadow: 0 0 60px rgba(0,0,0,0.8);
    touch-action: none; /* let JS own all touch gestures on the canvas */
  }
  #uiOverlay {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    pointer-events: none;
    z-index: 10;
    padding: 8px;
  }
  .toolbar {
    display: flex; gap: 4px; flex-wrap: wrap;
    justify-content: center; align-items: center;
    pointer-events: auto;
    max-width: 96vw;
  }
  .btn {
    padding: 6px 10px;
    background: rgba(26,26,26,0.85);
    border: 1px solid #555;
    color: #ccc;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.15s;
    white-space: nowrap;
    line-height: 1.2;
  }
  .btn:hover { background: rgba(60,60,60,0.9); border-color: #C9B896; color: #fff; }
  .btn.active { background: rgba(201,184,150,0.2); border-color: #C9B896; color: #C9B896; font-weight: bold; }
  .btn.action { border-color: #8B4513; color: #d4a574; }
  .btn.action:hover { border-color: #C9B896; background: rgba(139,69,19,0.3); }
  .btn-label { font-size: 9px; opacity: 0.7; display: block; }
  .color-swatch {
    display: inline-block;
    width: 10px; height: 10px;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 2px;
    margin-right: 4px;
    vertical-align: middle;
  }
  .slider-group {
    display: flex; align-items: center; gap: 6px;
    padding: 4px 8px;
    background: rgba(26,26,26,0.85);
    border: 1px solid #555;
    border-radius: 3px;
  }
  .slider-group label { font-size: 11px; color: #ccc; white-space: nowrap; }
  .slider-group input[type=range] {
    width: 80px; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: #444; border-radius: 2px; outline: none;
  }
  .slider-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #C9B896; cursor: pointer;
  }
  .slider-group input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; border: none;
    background: #C9B896; cursor: pointer;
  }
  .slider-val { font-size: 11px; color: #C9B896; min-width: 16px; text-align: center; }
  #hud {
    position: absolute;
    bottom: 8px; left: 8px;
    font-size: 10px; color: #666;
    pointer-events: none;
    z-index: 10;
    line-height: 1.5;
  }
  #hud span { color: #C9B896; }

  /* touch devices: bigger tap targets for toolbar controls */
  @media (pointer: coarse) {
    .btn {
      padding: 10px 14px;
      font-size: 13px;
    }
    .btn-label { font-size: 10px; }
    .slider-group { padding: 8px 12px; }
    .slider-group input[type=range] {
      width: 100px; height: 22px;
    }
    .slider-group input[type=range]::-webkit-slider-thumb {
      width: 24px; height: 24px;
    }
    .slider-group input[type=range]::-moz-range-thumb {
      width: 24px; height: 24px;
    }
    .toolbar { gap: 6px; }
  }
</style>

<body>
<div id="gameWrap">
  <canvas id="gameCanvas" width="1280" height="720"></canvas>
  <div id="uiOverlay">
    <div class="toolbar" id="toolbar"></div>
  </div>
  <div id="hud"></div>
</div>

<script>
"use strict";

// ============================================================
// 1. CONFIG & CONSTANTS
// ============================================================
const CONFIG = {
  grid: { width: 320, height: 180, cellSize: 4 },
  stickFigures: {
    maxCount: 40,
    spawnInterval: 180,
    personaWeights: [0.60, 0.25, 0.12, 0.03],
    baseSpeed: 0.3,
    walkSpeed: 0.4,
    fleeSpeed: 0.6,
    climbSpeed: 0.2,
    turnDelayMin: 60,
    turnDelayMax: 120,
    dragLerp: 0.2,
    dragStun: 30,
    // greed & fear tuning — how hard souls chase greenery, and how
    // readily rivalry over it boils into blows
    fightRange: 18,
    fightChance: 0.06,
    fightCooldown: 420,
    liberationChance: 0.0001,
    maxLiberationsPerCycle: 2,
    liberationIdleFrames: 600,
    liberationSafeFrames: 300,
  },
  fireWheel: {
    initialRadius: 40,
    maxRadius: 200,
    growthPerAbsorb: 2,
    autoSpawnInterval: 12000,
    wanderSpeed: 1.5,
    dragLerp: 0.15,
    criticalMassFigures: 5,
    edgeFireThreshold: 120,
  },
  explosion: {
    shockwaveSpeed: 12,
    destructionRate: 0.8,
    phases: { implosion: 30, blast: 60, settle: 320, rebirth: 40 },
  },
  plant: {
    growthInterval: 300,
    branchChance: 0.10,
    maxHeight: 30,
    maxWidth: 15,
    burnTime: 180,
  },
};

  const P = { EMPTY:0, SAND:1, WATER:2, FIRE:3, MAGMA:4, OIL:5, STONE:6, GUNPOWDER:7, ASH:8, PLANT:9 };
  // Relative densities govern who floats and who sinks. A granular or
  // liquid body always displaces any lighter fluid beneath it:
  //   oil 0.8 < water 1.0 < ash 1.2 < sand 1.6 < gunpowder 1.7
  // Fire is breath (rises); stone and magma are the earth (static).

const PARTICLE_INFO = [
  { name:"Empty",   cn:"空",   color:null },
  { name:"Sand",    cn:"沙",   color:"#C9B896" },
  { name:"Water",   cn:"水",   color:"#4A90D9" },
  { name:"Fire",    cn:"火",   color:"#FF4500" },
  { name:"Magma",   cn:"岩浆", color:"#FF6600" },
  { name:"Oil",     cn:"油",   color:"#3D3D3D" },
  { name:"Stone",   cn:"石",   color:"#555555" },
  { name:"Gunpowder", cn:"火药", color:"#2A2A2A" },
  { name:"Ash",     cn:"灰",   color:"#3A3A3A" },
  { name:"Plant",   cn:"植物", color:"#2D5A2D" },
];

// Color variants for visual richness [r,g,b]
const COLOR_VARIANTS = {
  [P.SAND]:    [[201,184,150],[184,160,136],[166,142,122],[210,195,165]],
  [P.WATER]:   [[74,144,217],[58,123,200],[45,90,138],[90,160,230]],
  [P.FIRE]:    [[255,69,0],[255,102,0],[255,153,0],[255,204,0],[255,51,0]],
  [P.MAGMA]:   [[255,102,0],[204,51,0],[255,68,0],[255,140,0]],
  [P.OIL]:     [[61,61,61],[45,45,45],[26,26,26],[75,70,60]],
  [P.STONE]:   [[85,85,85],[68,68,68],[102,102,102],[75,75,75]],
  [P.GUNPOWDER]:[[42,42,42],[37,37,37],[50,45,40],[30,30,30]],
  [P.ASH]:     [[58,58,58],[42,42,42],[74,74,74],[50,50,50]],
  [P.PLANT]:   [[45,90,45],[58,122,58],[74,154,74],[35,70,35]],
};

const STATES = {
  IDLE:0, WALK:1, FLEE:2, STRUGGLE:3, BURIED:4,
  DROWNING:5, BURNING:6, STUNNED:7, ASCENDING:8, DRAGGED:9, CLIMB:10,
  FIGHT:11
};

const PERSONAS = { APATHETIC:0, RESTLESS:1, SURVIVOR:2, SEEKER:3 };

// ============================================================
// 2. UTILITY
// ============================================================
function rand(n) { return Math.floor(Math.random() * n); }
function randRange(a,b) { return a + Math.random() * (b-a); }
function chance(p) { return Math.random() < p; }
function clamp(v,lo,hi) { return v < lo ? lo : (v > hi ? hi : v); }
function lerp(a,b,t) { return a + (b-a)*t; }
function dist2(ax,ay,bx,by) { const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }

// ============================================================
// 3. PARTICLE ENGINE
// ============================================================
class ParticleEngine {
  constructor(w, h) {
    this.w = w; this.h = h;
    this.size = w * h;
    this.grid = new Uint8Array(this.size);
    this.life = new Uint8Array(this.size);   // lifetime / timer
    this.temp = new Uint8Array(this.size);   // temperature 0-255
    this.updated = new Uint8Array(this.size);
    this.frame = 0;
    this.scanDir = 1; // 1 = L->R, -1 = R->L
    this._imgData = null; // cached in render()
    // plant registry: rebuilt periodically so beings can sense greenery
    // and water bodies across the whole map without per-figure scans
    this.plantList = [];        // [{x, y}] cell coords of every PLANT cell
    this.plantClusters = [];    // [{x, y, size}] centroids in cell coords
    this.waterClusters = [];    // [{x, y, size}] centroids in cell coords
    this._cVisited = null;      // scratch buffer for flood fill
    this._plantScanCounter = 0;
  }

  idx(x, y) { return y * this.w + x; }
  inBounds(x, y) { return x >= 0 && x < this.w && y >= 0 && y < this.h; }
  get(x, y) { return this.inBounds(x,y) ? this.grid[this.idx(x,y)] : P.STONE; }
  set(x, y, t) { if (this.inBounds(x,y)) { const i=this.idx(x,y); this.grid[i]=t; this.life[i]=0; this.temp[i]=0; } }

  clear() {
    this.grid.fill(0); this.life.fill(0); this.temp.fill(0);
  }

  // Swap contents of two cells (including metadata)
  swap(i, j) {
    const t = this.grid[i]; this.grid[i] = this.grid[j]; this.grid[j] = t;
    const l = this.life[i];  this.life[i] = this.life[j];  this.life[j] = l;
    const tp = this.temp[i]; this.temp[i] = this.temp[j]; this.temp[j] = tp;
    this.updated[j] = 1;
  }

  // Move particle from i to empty j
  moveTo(i, j) {
    this.grid[j] = this.grid[i]; this.life[j] = this.life[i]; this.temp[j] = this.temp[i];
    this.grid[i] = P.EMPTY; this.life[i] = 0; this.temp[i] = 0;
    this.updated[j] = 1;
  }

  // Set cell to type with life
  setCell(i, t, life=0, temp=0) {
    this.grid[i] = t; this.life[i] = life; this.temp[i] = temp; this.updated[i] = 1;
  }

  isLiquid(t) { return t === P.WATER || t === P.OIL; }
  isSolid(t) { return t === P.SAND || t === P.STONE || t === P.GUNPOWDER || t === P.ASH || t === P.MAGMA || t === P.PLANT; }
  isFlammable(t) { return t === P.OIL || t === P.GUNPOWDER || t === P.PLANT; }

  // Explosion at grid coords with radius
  explode(cx, cy, radius) {
    const r2 = radius * radius;
    for (let dy = -radius; dy <= radius; dy++) {
      for (let dx = -radius; dx <= radius; dx++) {
        if (dx*dx + dy*dy > r2) continue;
        const x = cx + dx, y = cy + dy;
        if (!this.inBounds(x,y)) continue;
        const i = this.idx(x,y);
        const t = this.grid[i];
        if (t === P.EMPTY) {
          if (chance(0.3)) this.setCell(i, P.FIRE, 40+rand(40), 200);
        } else if (t === P.GUNPOWDER) {
          // chain reaction - delayed
          this.setCell(i, P.FIRE, 60, 255);
        } else if (t === P.OIL) {
          this.setCell(i, P.FIRE, 80+rand(60), 255);
        } else if (t === P.STONE) {
          if (chance(0.4)) this.setCell(i, P.SAND, 0, 0);
          else if (chance(0.3)) this.setCell(i, P.EMPTY);
        } else if (t === P.PLANT) {
          this.setCell(i, P.FIRE, 60, 200);
        } else {
          // sand, ash, water, magma - scatter or destroy
          if (chance(0.6)) this.setCell(i, P.EMPTY);
          else if (chance(0.3)) this.setCell(i, P.ASH);
        }
      }
    }
    // fire ring
    for (let a = 0; a < 16; a++) {
      const ang = (a / 16) * Math.PI * 2;
      const x = cx + Math.round(Math.cos(ang) * radius);
      const y = cy + Math.round(Math.sin(ang) * radius);
      if (this.inBounds(x,y) && this.get(x,y) === P.EMPTY) {
        this.setCell(this.idx(x,y), P.FIRE, 50+rand(30), 200);
      }
    }
  }

  update() {
    this.frame++;
    this.updated.fill(0);
    this.scanDir = this.frame % 2 === 0 ? 1 : -1;

    // periodic full-grid plant rescan (cheap: one pass every 30 frames,
    // shared by all figures; self-heals after any direct grid writes)
    if (--this._plantScanCounter <= 0) {
      this._plantScanCounter = 30;
      this.rebuildPlants();
    }

    for (let y = this.h - 1; y >= 0; y--) {
      if (this.scanDir === 1) {
        for (let x = 0; x < this.w; x++) this.updateCell(x, y);
      } else {
        for (let x = this.w - 1; x >= 0; x--) this.updateCell(x, y);
      }
    }

    // ambient cooling: embers fade, so ground scorched by an old fire
    // no longer instantly ignites freshly painted oil or gunpowder
    // (fire and magma manage their own heat)
    if (this.frame % 2 === 0) {
      const grid = this.grid, temp = this.temp;
      for (let i = 0; i < this.size; i++) {
        const t = grid[i];
        if (temp[i] !== 0 && t !== P.FIRE && t !== P.MAGMA) {
          temp[i] = temp[i] > 2 ? temp[i] - 2 : 0;
        }
      }
    }

    // communicating vessels: joined waters settle to one common level
    if (this.frame % 16 === 3) this.levelWater();
  }

  rebuildPlants() {
    const list = [];
    const grid = this.grid;
    for (let i = 0; i < this.size; i++) {
      if (grid[i] === P.PLANT) {
        list.push({ x: i % this.w, y: (i / this.w) | 0 });
      }
    }
    this.plantList = list;
    // cluster pass: groves and ponds as whole bodies {x, y, size}
    if (!this._cVisited || this._cVisited.length !== this.size) {
      this._cVisited = new Uint8Array(this.size);
    }
    this._cVisited.fill(0);
    this.plantClusters = this.buildClusters(P.PLANT);
    this.waterClusters = this.buildClusters(P.WATER);
  }

  // --- connected-vessel levelling -------------------------------------
  // Air presses alike on every free surface, so waters joined beneath
  // the horizon must share one level. Each pass flood-fills every pond,
  // solves the common surface with a water-filling algorithm, then
  // moves a small quota of cells from higher surfaces to lower ones —
  // gentle enough to read as flow, not teleportation. Streams still
  // falling (waterfalls) and stray droplets are left to the normal CA.
  levelWater() {
    const grid = this.grid, w = this.w, h = this.h;
    if (!this._cVisited || this._cVisited.length !== this.size) {
      this._cVisited = new Uint8Array(this.size);
    }
    const visited = this._cVisited;
    visited.fill(0);
    const stack = [];
    for (let i0 = 0; i0 < this.size; i0++) {
      if (visited[i0] || grid[i0] !== P.WATER) continue;
      // flood one body; record per-column extent and support
      stack.length = 0;
      stack.push(i0);
      visited[i0] = 1;
      const cols = new Map();          // x -> {top, bottom, count, clean}
      let cells = 0, supported = 0;
      while (stack.length) {
        const i = stack.pop();
        const x = i % w, y = (i / w) | 0;
        cells++;
        let c = cols.get(x);
        if (!c) { cols.set(x, { top: y, bottom: y, count: 1 }); }
        else {
          c.count++;
          if (y < c.top) c.top = y;
          if (y > c.bottom) c.bottom = y;
        }
        if (y + 1 >= h || grid[i + w] !== P.EMPTY) supported++;
        if (x > 0 && !visited[i-1] && grid[i-1] === P.WATER) { visited[i-1] = 1; stack.push(i-1); }
        if (x < w-1 && !visited[i+1] && grid[i+1] === P.WATER) { visited[i+1] = 1; stack.push(i+1); }
        if (y > 0 && !visited[i-w] && grid[i-w] === P.WATER) { visited[i-w] = 1; stack.push(i-w); }
        if (y < h-1 && !visited[i+w] && grid[i+w] === P.WATER) { visited[i+w] = 1; stack.push(i+w); }
      }
      if (cells < 8) continue;                    // droplets: CA suffices
      if (supported < cells * 0.9) continue;      // mid-air: not a pond yet
      // Columns with gaps inside their span (droplets stranded on
      // ledges, holes from sinking debris) have tops that do not name
      // the true surface; levelling through them just shuffles cells
      // that the CA immediately scatters, so the pond breathes forever.
      // Only clean, solid columns take part this cycle.
      for (const c of cols.values()) {
        c.clean = c.count === c.bottom - c.top + 1;
      }
      this.equalizeColumns(cols);
    }
  }

  // Solve the shared surface level L for one body, then shift at most
  // one cell per column of the deepest shore stretch per pass. Only
  // clean (gap-free) columns take part — see levelWater().
  equalizeColumns(cols) {
    const grid = this.grid, life = this.life, temp = this.temp;
    const w = this.w, h = this.h;
    const arr = [];
    let totalCells = 0;
    for (const [x, c] of cols) {
      if (!c.clean) continue;
      arr.push({ x, top: c.top, bottom: c.bottom, count: c.count });
      totalCells += c.count;
    }
    if (arr.length < 2 || totalCells < 8) return;
    arr.sort((a, b) => a.bottom - b.bottom);      // by floor height
    const n = arr.length;

    // water-filling: raise L group by group until it holds all cells
    let sumFloor = 0, k = 0, L = arr[0].bottom + 1;
    while (k < n) {
      while (k < n && arr[k].bottom + 1 <= L) { sumFloor += arr[k].bottom + 1; k++; }
      const cap = L * k - sumFloor;
      if (cap >= totalCells) break;
      const needL = Math.ceil((totalCells + sumFloor) / Math.max(1, k));
      if (k < n) L = Math.min(arr[k].bottom + 1, Math.max(L + 1, needL));
      else { L = needL; break; }
    }

    // Exact targets: ceil() above overshoots by a few cells, and that
    // phantom surplus used to roam the pond forever as one column after
    // another dipped to −2 and got trimmed. Distribute the remainder so
    // the targets sum to EXACTLY the water on hand — then every move
    // strictly reduces total disagreement and the surface truly freezes.
    let excess = 0;
    for (const c of arr) {
      const F = c.bottom + 1;
      c.target = F <= L ? L - F : 0;
      excess += c.target;
    }
    excess -= totalCells;
    if (excess > 0) {
      const byDepth = [...arr].sort((a, b) => b.target - a.target);
      while (excess > 0) {
        let trimmed = 0;
        for (let i = 0; i < byDepth.length && excess > 0; i++) {
          if (byDepth[i].target > 0) { byDepth[i].target--; excess--; trimmed++; }
        }
        if (trimmed === 0) break;   // every target already zero
      }
    }

    // classify columns against the target. Donors must be clearly above
    // target (delta ≤ −2) so motion is one-way and never churns; takers
    // qualify from delta ≥ 1 so the pond trims to within a single row.
    const surplus = [], deficit = [];
    for (const c of arr) {
      const delta = c.target - c.count;
      if (delta <= -2) surplus.push({ x: c.x, top: c.top, need: -delta });
      else if (delta >= 1) deficit.push({ x: c.x, top: c.top, bottom: c.bottom, need: delta });
    }
    if (!surplus.length || !deficit.length) return;

    // Raise CONTIGUOUS stretches of shore together, one cell per column
    // per pass. Even inflow is what the cellular automaton can accept:
    // pumping many cells into a few narrow columns makes the surface
    // leap up in spikes that immediately collapse, and the pond never
    // seems to settle. EVERY stretch gets its share each pass — picking
    // the neediest first starved distant shores when a big needy run on
    // open ground could never hold what it was given.
    deficit.sort((a, b) => a.x - b.x);
    const runs = [];
    for (const d of deficit) {
      const last = runs[runs.length - 1];
      if (last && d.x <= last[last.length - 1].x + 1) last.push(d);
      else runs.push([d]);
    }
    let si = 0;
    outer:
    for (const run of runs) {
      for (const D of run) {
        // one cell onto this column, if it has room and headroom
        while (si < surplus.length) {
          const ty = D.top - 1;
          if (ty < 0 || grid[ty * w + D.x] !== P.EMPTY) break;          // cannot receive
          if (ty - 1 >= 0 && grid[(ty - 1) * w + D.x] !== P.EMPTY) break;
          const S = surplus[si];
          const dstIdx = ty * w + D.x;
          grid[dstIdx] = P.WATER; life[dstIdx] = 0; temp[dstIdx] = 0;
          D.top--; D.need--;
          const srcIdx = S.top * w + S.x;
          grid[srcIdx] = P.EMPTY; life[srcIdx] = 0; temp[srcIdx] = 0;
          S.top++; S.need--;
          if (S.need <= 0) si++;
          break;   // one cell per column per pass
        }
        if (si >= surplus.length) break outer;
      }
    }
  }

  // Flood-fill connected regions of one particle type into clusters
  // with a centroid and cell count — the "size" a being can sense.
  buildClusters(t) {
    const clusters = [];
    const grid = this.grid, w = this.w, h = this.h;
    const visited = this._cVisited;
    const stack = [];
    for (let i0 = 0; i0 < this.size; i0++) {
      if (visited[i0] || grid[i0] !== t) continue;
      stack.length = 0;
      stack.push(i0);
      visited[i0] = 1;
      let size = 0, sx = 0, sy = 0;
      let minX = w, maxX = 0, minY = h, maxY = 0;
      const colTop = {};
      while (stack.length) {
        const i = stack.pop();
        const x = i % w, y = (i / w) | 0;
        size++; sx += x; sy += y;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        // highest cell of this cluster in each column — lets seekers aim
        // at real surface instead of the bounding box's empty corners
        if (colTop[x] === undefined || y < colTop[x]) colTop[x] = y;
        if (x > 0 && !visited[i-1] && grid[i-1] === t) { visited[i-1] = 1; stack.push(i-1); }
        if (x < w-1 && !visited[i+1] && grid[i+1] === t) { visited[i+1] = 1; stack.push(i+1); }
        if (y > 0 && !visited[i-w] && grid[i-w] === t) { visited[i-w] = 1; stack.push(i-w); }
        if (y < h-1 && !visited[i+w] && grid[i+w] === t) { visited[i+w] = 1; stack.push(i+w); }
      }
      clusters.push({
        x: sx / size, y: sy / size, size,
        minX, maxX, minY, maxY, colTop
      });
    }
    return clusters;
  }

  updateCell(x, y) {
    const i = this.idx(x, y);
    if (this.updated[i]) return;
    const t = this.grid[i];
    if (t === P.EMPTY) return;

    switch (t) {
      case P.SAND: this.updateSand(x, y, i); break;
      case P.WATER: this.updateWater(x, y, i); break;
      case P.FIRE: this.updateFire(x, y, i); break;
      case P.MAGMA: this.updateMagma(x, y, i); break;
      case P.OIL: this.updateOil(x, y, i); break;
      case P.STONE: this.updateStone(x, y, i); break;
      case P.GUNPOWDER: this.updateGunpowder(x, y, i); break;
      case P.ASH: this.updateAsh(x, y, i); break;
      case P.PLANT: this.updatePlant(x, y, i); break;
    }
  }

  // --- SAND ---
  updateSand(x, y, i) {
    // heat check - hot sand fuses to stone
    if (this.temp[i] > 150 && chance(0.02)) {
      this.setCell(i, P.STONE, 0, 0);
      return;
    }
    const below = this.idx(x, y+1);
    if (y+1 < this.h && this.grid[below] === P.EMPTY) {
      this.moveTo(i, below); return;
    }
    // diagonal
    const dir = this.scanDir;
    const d1x = x + dir, d2x = x - dir;
    if (y+1 < this.h) {
      if (this.inBounds(d1x,y+1) && this.grid[this.idx(d1x,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(d1x,y+1)); return;
      }
      if (this.inBounds(d2x,y+1) && this.grid[this.idx(d2x,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(d2x,y+1)); return;
      }
      // displace water/oil
      if (this.inBounds(d1x,y+1) && this.isLiquid(this.grid[this.idx(d1x,y+1)])) {
        this.swap(i, this.idx(d1x,y+1)); return;
      }
      if (this.inBounds(d2x,y+1) && this.isLiquid(this.grid[this.idx(d2x,y+1)])) {
        this.swap(i, this.idx(d2x,y+1)); return;
      }
      if (this.grid[below] !== P.EMPTY && this.isLiquid(this.grid[below])) {
        this.swap(i, below); return;
      }
    }
  }

  // --- WATER ---
  updateWater(x, y, i) {
    // reactions with neighbors
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (!this.inBounds(nx,ny)) continue;
      const ni = this.idx(nx,ny);
      const nt = this.grid[ni];
      if (nt === P.FIRE) {
        // steam: remove water, weaken fire
        this.grid[i] = P.EMPTY; this.life[i]=0;
        if (this.life[ni] > 10) this.life[ni] = Math.floor(this.life[ni] * 0.5);
        else this.grid[ni] = P.EMPTY;
        return;
      }
      if (nt === P.MAGMA) {
        // water evaporates to steam, magma cools but stays magma
        this.grid[i] = P.EMPTY;
        this.temp[ni] = Math.max(0, this.temp[ni] - 80);
        for (const [sx,sy] of [[x-1,y],[x+1,y],[x,y-1]]) {
          if (this.inBounds(sx,sy) && this.grid[this.idx(sx,sy)] === P.EMPTY && chance(0.6)) {
            this.setCell(this.idx(sx,sy), P.FIRE, 15, 100);
          }
        }
        return;
      }
    }
    // movement — fall first
    const below = this.idx(x, y+1);
    if (y+1 < this.h && this.grid[below] === P.EMPTY) {
      this.moveTo(i, below); return;
    }
    // density 1.0 > oil 0.8: water sinks beneath oil, oil rises to the top
    if (y+1 < this.h && this.grid[below] === P.OIL && chance(0.4)) {
      this.swap(i, below); return;
    }
    const dir = this.scanDir;
    // down-diagonal
    if (y+1 < this.h) {
      const dx1 = x + dir;
      if (this.inBounds(dx1,y+1) && this.grid[this.idx(dx1,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(dx1,y+1)); return;
      }
      const dx2 = x - dir;
      if (this.inBounds(dx2,y+1) && this.grid[this.idx(dx2,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(dx2,y+1)); return;
      }
    }
    // horizontal flow: seek a drop (cell with empty below), range 10.
    // Sideways motion only ever happens toward a genuine fall — flowing
    // onto flat ground made surface cells hop between rims forever as
    // the scan direction alternated, so ponds never looked settled.
    const range = 10;
    for (const d of [dir, -dir]) {
      for (let step = 1; step <= range; step++) {
        const nx = x + d * step;
        if (!this.inBounds(nx,y)) break;
        const ni = this.idx(nx,y);
        if (this.grid[ni] !== P.EMPTY) break;
        // found a drop — flow there immediately
        if (y+1 < this.h && this.grid[this.idx(nx,y+1)] === P.EMPTY) {
          this.moveTo(i, ni); return;
        }
      }
    }
    // Submerged cells transmit pressure sideways — how water crosses
    // flat pipes and the bottom channel of communicating vessels. Only
    // cells with a roof of water may drift; the free surface stays put
    // or ponds shimmer forever as the scan direction alternates.
    if (y > 0 && this.grid[this.idx(x, y - 1)] === P.WATER) {
      for (const d of [dir, -dir]) {
        for (let step = 1; step <= 6; step++) {
          const nx = x + d * step;
          if (!this.inBounds(nx,y)) break;
          const ni = this.idx(nx,y);
          if (this.grid[ni] !== P.EMPTY) break;
          if (step === 6 || !this.inBounds(nx+d,y) ||
              this.grid[this.idx(nx+d,y)] !== P.EMPTY) {
            this.moveTo(i, ni); return;
          }
        }
      }
    }
    // settled: nothing to fall or seep toward within reach
  }

  // --- FIRE ---
  updateFire(x, y, i) {
    // lifetime
    this.life[i]++;
    if (this.life[i] > 60 + rand(60)) {
      if (chance(0.7)) this.grid[i] = P.EMPTY;
      else this.setCell(i, P.ASH);
      return;
    }
    // spread to flammable neighbors
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y],[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]]) {
      if (!this.inBounds(nx,ny)) continue;
      const ni = this.idx(nx,ny);
      const nt = this.grid[ni];
      if (nt === P.OIL && chance(0.4)) {
        this.setCell(ni, P.FIRE, 100+rand(100), 255);
      } else if (nt === P.GUNPOWDER) {
        this.explode(nx, ny, 4);
        return;
      } else if (nt === P.PLANT && chance(0.15)) {
        this.setCell(ni, P.FIRE, 80+rand(60), 200);
      } else if (nt === P.WATER && chance(0.3)) {
        this.grid[ni] = P.EMPTY;
        this.life[i] += 20;
      }
    }
    // heat neighbors
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (this.inBounds(nx,ny)) {
        const ni = this.idx(nx,ny);
        if (this.temp[ni] < 200) this.temp[ni] = Math.min(255, this.temp[ni] + 5);
      }
    }
    // buoyancy: only rise after burning for a while, and with reduced chance
    // (fire stays on ground first, then gradually rises)
    if (this.life[i] > 20 && y > 0 && chance(0.4)) {
      const above = this.idx(x, y-1);
      if (this.grid[above] === P.EMPTY) {
        this.moveTo(i, above); return;
      }
      const dir = this.scanDir;
      const d1x = x + dir;
      if (this.inBounds(d1x,y-1) && this.grid[this.idx(d1x,y-1)] === P.EMPTY) {
        this.moveTo(i, this.idx(d1x,y-1)); return;
      }
      const d2x = x - dir;
      if (this.inBounds(d2x,y-1) && this.grid[this.idx(d2x,y-1)] === P.EMPTY) {
        this.moveTo(i, this.idx(d2x,y-1)); return;
      }
    }
  }

  // --- MAGMA ---
  updateMagma(x, y, i) {
    // cool down (temp only affects stone-melting ability; magma never solidifies)
    this.temp[i] = Math.max(0, this.temp[i] - 1);
    // reactions
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (!this.inBounds(nx,ny)) continue;
      const ni = this.idx(nx,ny);
      const nt = this.grid[ni];
      if (nt === P.WATER) {
        // water evaporates to steam, magma cools but stays magma
        this.grid[ni] = P.EMPTY;
        this.temp[i] = Math.max(0, this.temp[i] - 80);
        for (const [sx,sy] of [[x-1,y-1],[x+1,y-1],[x,y-2]]) {
          if (this.inBounds(sx,sy) && this.grid[this.idx(sx,sy)] === P.EMPTY && chance(0.6))
            this.setCell(this.idx(sx,sy), P.FIRE, 15, 100);
        }
        return;
      }
      if (nt === P.OIL && chance(0.5)) { this.setCell(ni, P.FIRE, 120, 255); }
      if (nt === P.GUNPOWDER) { this.explode(nx, ny, 4); return; }
      if (nt === P.PLANT && chance(0.3)) { this.setCell(ni, P.FIRE, 80, 200); }
      if (nt === P.STONE && this.temp[i] > 220 && chance(0.008)) { this.setCell(ni, P.MAGMA, 0, 255); }
    }
    // move like sand
    const below = this.idx(x, y+1);
    if (y+1 < this.h && this.grid[below] === P.EMPTY) { this.moveTo(i, below); return; }
    const dir = this.scanDir;
    if (y+1 < this.h) {
      if (this.inBounds(x+dir,y+1) && this.grid[this.idx(x+dir,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(x+dir,y+1)); return;
      }
      if (this.inBounds(x-dir,y+1) && this.grid[this.idx(x-dir,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(x-dir,y+1)); return;
      }
    }
  }

  // --- OIL ---
  updateOil(x, y, i) {
    // check ignition
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (this.inBounds(nx,ny)) {
        const ni = this.idx(nx,ny);
        if (this.grid[ni] === P.FIRE || this.grid[ni] === P.MAGMA || this.temp[ni] > 150) {
          this.setCell(i, P.FIRE, 120+rand(100), 255); return;
        }
      }
    }
    // float on water: if below is water, try to move sideways/up
    const below = y+1 < this.h ? this.grid[this.idx(x,y+1)] : P.STONE;
    if (below === P.WATER) {
      // try move up
      if (y > 0 && this.grid[this.idx(x,y-1)] === P.EMPTY) {
        this.moveTo(i, this.idx(x,y-1)); return;
      }
      const dir = this.scanDir;
      for (const dx of [dir, -dir]) {
        if (this.inBounds(x+dx,y) && this.grid[this.idx(x+dx,y)] === P.EMPTY) {
          this.moveTo(i, this.idx(x+dx,y)); return;
        }
      }
    }
    // flow like water but slower (max 2 horizontal)
    if (y+1 < this.h && below === P.EMPTY) { this.moveTo(i, this.idx(x,y+1)); return; }
    const dir = this.scanDir;
    if (y+1 < this.h) {
      if (this.inBounds(x+dir,y+1) && this.grid[this.idx(x+dir,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(x+dir,y+1)); return;
      }
      if (this.inBounds(x-dir,y+1) && this.grid[this.idx(x-dir,y+1)] === P.EMPTY) {
        this.moveTo(i, this.idx(x-dir,y+1)); return;
      }
    }
    for (let step = 1; step <= 2; step++) {
      const nx = x + dir * step;
      if (!this.inBounds(nx,y)) break;
      const ni = this.idx(nx,y);
      if (this.grid[ni] === P.EMPTY) { this.moveTo(i, ni); return; }
      else break;
    }
    for (let step = 1; step <= 2; step++) {
      const nx = x - dir * step;
      if (!this.inBounds(nx,y)) break;
      const ni = this.idx(nx,y);
      if (this.grid[ni] === P.EMPTY) { this.moveTo(i, ni); return; }
      else break;
    }
  }

  // --- STONE ---
  updateStone(x, y, i) {
    // melt from magma contact — only if magma is extremely hot
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (this.inBounds(nx,ny)) {
        const ni = this.idx(nx,ny);
        if (this.grid[ni] === P.MAGMA && this.temp[ni] > 220 && chance(0.005)) {
          this.setCell(i, P.MAGMA, 0, 255); return;
        }
      }
    }
    // static
  }

  // --- GUNPOWDER ---
  updateGunpowder(x, y, i) {
    // wet check
    if (this.life[i] > 0) {
      this.life[i]--;
      if (this.life[i] === 0) { /* dried */ }
    }
    // ignition
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (this.inBounds(nx,ny)) {
        const ni = this.idx(nx,ny);
        if (this.grid[ni] === P.FIRE || this.grid[ni] === P.MAGMA || this.temp[ni] > 150) {
          if (this.life[i] === 0) { this.explode(x, y, 4); return; }
        }
        if (this.grid[ni] === P.WATER && this.life[i] === 0) {
          this.life[i] = 200; // wetted
        }
      }
    }
    // fall like sand; density 1.7 — sinks through water and oil
    const below = this.idx(x, y+1);
    if (y+1 < this.h) {
      if (this.grid[below] === P.EMPTY) { this.moveTo(i, below); return; }
      if (this.isLiquid(this.grid[below])) { this.swap(i, below); return; }
    }
    const dir = this.scanDir;
    if (y+1 < this.h) {
      if (this.inBounds(x+dir,y+1)) {
        const ni = this.idx(x+dir,y+1);
        if (this.grid[ni] === P.EMPTY || this.isLiquid(this.grid[ni])) { this.moveTo(i, ni); return; }
      }
      if (this.inBounds(x-dir,y+1)) {
        const ni = this.idx(x-dir,y+1);
        if (this.grid[ni] === P.EMPTY || this.isLiquid(this.grid[ni])) { this.moveTo(i, ni); return; }
      }
    }
  }

  // --- ASH ---
  updateAsh(x, y, i) {
    // floaty fall - only every other frame; density 1.2 means it also
    // sinks slowly through water and oil instead of drifting on them
    if (this.frame % 2 !== 0) return;
    const below = this.idx(x, y+1);
    if (y+1 < this.h && this.grid[below] === P.EMPTY) { this.moveTo(i, below); return; }
    // waterlogged: displace any lighter fluid beneath
    if (y+1 < this.h && this.isLiquid(this.grid[below])) { this.swap(i, below); return; }
    // random horizontal drift (air only — ash does not flow across liquid)
    if (chance(0.3)) {
      const dx = chance(0.5) ? 1 : -1;
      if (this.inBounds(x+dx,y) && this.grid[this.idx(x+dx,y)] === P.EMPTY) {
        this.moveTo(i, this.idx(x+dx,y)); return;
      }
    }
    if (y+1 < this.h) {
      const dir = this.scanDir;
      if (this.inBounds(x+dir,y+1)) {
        const ni = this.idx(x+dir,y+1), nt = this.grid[ni];
        if (nt === P.EMPTY || this.isLiquid(nt)) { this.moveTo(i, ni); return; }
      }
    }
  }

  // --- PLANT ---
  updatePlant(x, y, i) {
    // burn check
    for (const [nx,ny] of [[x,y-1],[x,y+1],[x-1,y],[x+1,y]]) {
      if (this.inBounds(nx,ny)) {
        const ni = this.idx(nx,ny);
        if (this.grid[ni] === P.FIRE || this.grid[ni] === P.MAGMA) {
          this.setCell(i, P.FIRE, 80+rand(60), 200); return;
        }
      }
    }
    // growth timer
    this.life[i]++;
    let interval = CONFIG.plant.growthInterval;
    // water nearby accelerates
    for (const [nx,ny] of [[x-1,y],[x+1,y],[x,y-1],[x,y+1],[x-1,y-1],[x+1,y-1],[x-1,y+1],[x+1,y+1]]) {
      if (this.inBounds(nx,ny) && this.grid[this.idx(nx,ny)] === P.WATER) {
        interval = Math.floor(interval / 2); break;
      }
    }
    // only grow if below max height (temp stores height from base)
    if (this.life[i] >= interval && this.temp[i] < CONFIG.plant.maxHeight) {
      this.life[i] = 0;
      const newHeight = this.temp[i] + 1;
      // grow upward
      if (y > 0 && this.grid[this.idx(x,y-1)] === P.EMPTY) {
        this.setCell(this.idx(x,y-1), P.PLANT, 0, newHeight);
        // branching
        if (chance(CONFIG.plant.branchChance)) {
          const bx = x + (chance(0.5) ? 1 : -1);
          if (this.inBounds(bx,y-1) && this.grid[this.idx(bx,y-1)] === P.EMPTY) {
            this.setCell(this.idx(bx,y-1), P.PLANT, 0, newHeight);
          }
        }
      }
    }
  }

  // Render particles to offscreen canvas context (1:1 pixel)
  render(ctx) {
    if (!this._imgData) this._imgData = ctx.createImageData(this.w, this.h);
    const data = this._imgData.data;
    // zero out alpha (and RGB) for all cells first
    data.fill(0);
    for (let i = 0; i < this.size; i++) {
      const t = this.grid[i];
      if (t === P.EMPTY) continue;
      const variants = COLOR_VARIANTS[t];
      if (!variants) continue;
      // integer hash to avoid regular striping from i % n
      const vi = ((i * 2654435761) >>> 0) % variants.length;
      const v = variants[vi];
      const off = i * 4;
      if (t === P.FIRE) {
        const flick = 0.7 + Math.random() * 0.3;
        data[off]   = Math.min(255, v[0] * flick);
        data[off+1] = Math.min(255, v[1] * flick);
        data[off+2] = Math.min(255, v[2] * flick);
      } else if (t === P.MAGMA) {
        const glow = 0.8 + Math.random() * 0.2;
        data[off]   = Math.min(255, v[0] * glow);
        data[off+1] = v[1] * glow;
        data[off+2] = v[2] * glow;
      } else {
        data[off]   = v[0];
        data[off+1] = v[1];
        data[off+2] = v[2];
      }
      data[off+3] = 255;
    }
    ctx.putImageData(this._imgData, 0, 0);
  }
}

// ============================================================
// 4. STICK FIGURE
// ============================================================
class StickFigure {
  constructor(x, y, persona) {
    this.x = x; this.y = y;       // pixel position, center of figure
    this.vx = 0; this.vy = 0;
    this.persona = persona;
    this.state = STATES.IDLE;
    this.health = 100;
    this.direction = chance(0.5) ? 1 : -1;
    this.animTimer = 0;
    this.animFrame = 0;
    this.turnTimer = rand(60) + 30;
    this.idleTimer = 0;
    this.safeTimer = 0;
    this.stunTimer = 0;
    this.burnTimer = 0;
    this.fearLevel = 0;
    this.isDragged = false;
    this.dragOffX = 0; this.dragOffY = 0;
    // capture by fire wheel
    this.beingPulled = false;
    this.pullX = 0; this.pullY = 0;
    this.pullAmount = 0;
    this.captured = false;
    this.capturedBy = null;   // reference to the wheel holding this soul
    this.captureAngle = 0;
    this.captureRadius = 0;
    this.captureSpeed = 0.03;
    // liberation
    this.isLiberating = false;
    this.libStage = 0;
    this.libTimer = 0;
    this.liberated = false;
    this.happy = false;
    this.oasisTarget = null;
    this._oasisTimer = 0;
    // temperament: 0 = fearful/conservative → 1 = greedy/adventurous.
    // Governs the greed-vs-fear trade-off when approaching plants
    // and how far away hazards are sensed. Persona adds a slight bias,
    // but individuals still vary widely within each persona.
    let g = randRange(0.2, 0.8);
    if (persona === PERSONAS.SURVIVOR) g -= 0.15;                       // survivors are wary
    else if (persona === PERSONAS.RESTLESS) g += 0.1;                   // restless wanderers are curious
    else if (persona === PERSONAS.SEEKER) g += 0.05;
    this.greed = clamp(g, 0.05, 0.95);
    // body dimensions in pixels
    this.bodyW = 10;
    this.bodyH = 22;
    this.dead = false;
    // 投胎 birth-light & quarrel bookkeeping
    this.birthTimer = 0;
    this.isReborn = false;
    this._fightCd = 0;
    this._rival = null;
    this._fightTimer = 0;
    this._fightFlash = 0;
    this._blocked = 0;
  }

  get gridX() { return Math.floor(this.x / CONFIG.grid.cellSize); }
  get gridY() { return Math.floor(this.y / CONFIG.grid.cellSize); }

  // Sample environment around figure
  sampleEnvironment(engine) {
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(this.x / cs);
    const gy = Math.floor(this.y / cs);
    let solidCount = 0, liquidCount = 0, fireContact = false, magmaContact = false;
    let plantContact = false, totalCells = 0;
    // sample 3 wide x 5 tall area around figure center
    for (let dy = -2; dy <= 2; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const cx = gx + dx, cy = gy + dy;
        if (!engine.inBounds(cx, cy)) continue;
        totalCells++;
        const t = engine.get(cx, cy);
        if (t === P.SAND || t === P.STONE || t === P.GUNPOWDER || t === P.ASH) solidCount++;
        else if (t === P.WATER || t === P.OIL) liquidCount++;
        else if (t === P.FIRE) fireContact = true;
        else if (t === P.MAGMA) magmaContact = true;
        else if (t === P.PLANT) plantContact = true;
      }
    }
    return {
      solidRatio: totalCells > 0 ? solidCount / totalCells : 0,
      liquidRatio: totalCells > 0 ? liquidCount / totalCells : 0,
      fireContact, magmaContact, plantContact,
    };
  }

  // Check if feet are on solid ground
  onGround(engine) {
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(this.x / cs);
    const footY = Math.floor((this.y + this.bodyH/2) / cs);
    for (const dx of [-1, 0, 1]) {
      const t = engine.get(gx + dx, footY);
      if (engine.isSolid(t) || t === P.MAGMA) return true;
    }
    return false;
  }

  // Can move to this pixel position? (check head/torso collision)
  canMoveTo(engine, nx, ny) {
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(nx / cs);
    const gy = Math.floor(ny / cs);
    for (let dy = -2; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const t = engine.get(gx+dx, gy+dy);
        if (t === P.STONE || t === P.MAGMA) return false;
      }
    }
    return true;
  }

  // Precise hazard probe along the body column. The coarse centre-window
  // sampler misses the head/feet rows, and magma that flows UNDER an
  // already-standing figure never overlaps the body at all — both let
  // beings survive what should be lethal contact. Includes the support
  // cell directly beneath the feet: standing on molten rock is fatal.
  probeBodyHazards(engine) {
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(this.x / cs);
    const top = Math.floor((this.y - this.bodyH/2) / cs);
    const bot = Math.floor((this.y + this.bodyH/2 + 1) / cs);
    let fire = false, magma = false;
    for (let cy = top; cy <= bot; cy++) {
      const t = engine.get(gx, cy);
      if (t === P.MAGMA) magma = true;
      else if (t === P.FIRE) fire = true;
    }
    return { fire, magma };
  }

  // Fire wheels are feared universally — every being senses them from afar.
  // Returns true (and caches this._threat) if a wheel is dangerously close.
  detectWheelThreat(wheels) {
    for (const wheel of wheels) {
      if (!wheel.active) continue;
      const wd = Math.sqrt(dist2(this.x, this.y, wheel.x, wheel.y));
      if (wd < wheel.radius + 220) {
        const cs = CONFIG.grid.cellSize;
        this._threat = { x: Math.floor(wheel.x / cs), y: Math.floor(wheel.y / cs), type: -1 };
        return true;
      }
    }
    return false;
  }

  // Sense elemental hazards (fire / magma only — water is an attraction,
  // not a terror; beings are drawn to its shore, never into its depths).
  // Cautious beings (low greed) sense danger from farther away;
  // adventurous ones only notice it when very close.
  // Throttled to every 4 frames; result cached in this._elemThreat.
  senseElementThreat(engine) {
    if (this._elemTimer === undefined) this._elemTimer = rand(4);
    if (--this._elemTimer > 0) return this._elemThreat;
    this._elemTimer = 4;

    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(this.x / cs);
    const gy = Math.floor(this.y / cs);
    const range = Math.round(5 + (1 - this.greed) * 11); // 5..16 cells
    let nearest = null;
    let nearestD = Infinity;
    for (let dy = -range; dy <= range; dy++) {
      for (let dx = -range; dx <= range; dx++) {
        const cx = gx+dx, cy = gy+dy;
        if (!engine.inBounds(cx, cy)) continue;
        const t = engine.get(cx, cy);
        if (t === P.FIRE || t === P.MAGMA) {
          const d = dx*dx + dy*dy;
          if (d < nearestD) { nearestD = d; nearest = { x: cx, y: cy, type: t }; }
        }
      }
    }
    this._elemThreat = nearest;
    return nearest;
  }

  // Choose the most alluring sanctuary among plant groves and ponds.
  // Two factors, as the eye of hunger sees them:
  //   size  — logarithmic, so vast groves do not endlessly dominate
  //   distance — strong falloff, so what grows nearby suffices
  //   score = (1 + ln(size+1)/2) ÷ (1 + distance / D),  D ≈ 140px
  // Distance is measured to the nearest LIVING COLUMN TOP — a real
  // surface cell, not a bounding-box corner that may hang over bare
  // cliff or thin air. A hedge around one's feet is truly near; a grove
  // down the cliff face draws its admirers to the edge, where gravity
  // finishes the descent. Throttled by caller; result cached in
  // this.oasisTarget as {x, y, type} in cell coords ("plant" | "water").
  findOasis(engine) {
    const cs = CONFIG.grid.cellSize;
    const fallDist = cs * 35;
    let best = null, bestScore = 0.8;  // below this, a distant speck lures no one
    const consider = (clusters, weight, type) => {
      for (const c of clusters) {
        // Nearest point of the ACTUAL body: the closest column top. A
        // bounding box lies about L-shaped or cliff-side groves — its
        // nearest corner can hang over bare stone, and a soul sent
        // there idles on the edge forever instead of descending.
        let bd2 = Infinity, tx = c.minX, ty = c.minY;
        for (const key in c.colTop) {
          const px2 = (+key) * cs + cs / 2;
          const py2 = c.colTop[key] * cs;
          const dd = dist2(this.x, this.y, px2, py2);
          if (dd < bd2) { bd2 = dd; tx = +key; ty = c.colTop[key]; }
        }
        const d = Math.sqrt(bd2);
        const s = weight * (1 + Math.log(c.size + 1) / 2) / (1 + d / fallDist);
        if (s > bestScore) {
          bestScore = s;
          best = { x: tx, y: ty, type };
        }
      }
    };
    if (engine.plantClusters) consider(engine.plantClusters, 1.0, "plant");
    if (engine.waterClusters) consider(engine.waterClusters, 0.85, "water");
    this.oasisTarget = best;
    return best !== null;
  }

  // Check if near water surface (happy) vs submerged (drowning)
  checkWaterMood(engine, env) {
    const cs = CONFIG.grid.cellSize;
    const gx = Math.floor(this.x / cs);
    const gy = Math.floor(this.y / cs);
    // water at feet level but not submerging
    let nearWater = false;
    for (let dy = -1; dy <= 2; dy++) {
      for (let dx = -2; dx <= 2; dx++) {
        if (engine.inBounds(gx+dx, gy+dy) && engine.get(gx+dx, gy+dy) === P.WATER) {
          nearWater = true;
        }
      }
    }
    // happy if near water but not drowning (liquidRatio low)
    return nearWater && env.liquidRatio < 0.4;
  }

  // Move away from nearest detected threat — panicked
  fleeFromThreat(engine) {
    const C = CONFIG.stickFigures;
    if (this._threat) {
      const cs = CONFIG.grid.cellSize;
      const tx = this._threat.x * cs + cs/2;
      const ty = this._threat.y * cs + cs/2;
      const dx = this.x - tx;
      // prefer horizontal flee; if threat is directly above/below, pick horizontal
      if (Math.abs(dx) > 4) {
        this.direction = dx > 0 ? 1 : -1;
      } else {
        this.direction = chance(0.5) ? 1 : -1;
      }
      // panic: occasional random direction switch
      if (chance(0.08)) this.direction *= -1;
      this.vx = this.direction * C.fleeSpeed * 1.2;
      // panicked jumping when blocked
      if (!this.canMoveTo(engine, this.x + this.vx, this.y) && this.onGround(engine)) {
        this.vy = -2.5;
      } else if (chance(0.04) && this.onGround(engine)) {
        this.vy = -1.5; // random panic hop
      }
    } else {
      this.vx = this.direction * C.fleeSpeed;
    }
    this.state = STATES.FLEE;
  }

  // Walk toward the chosen sanctuary — a plant grove, or the shore of a
  // pond. Nobody wades into water: its edge IS the destination. Fire or
  // magma on the path is another matter: greedy beings may brave it,
  // cautious ones halt and wait — behaviour varies with temperament.
  approachOasis(engine) {
    const C = CONFIG.stickFigures;
    const cs = CONFIG.grid.cellSize;
    const isWater = this.oasisTarget.type === "water";
    const arriveDist = isWater ? cs * 3 : cs * 2;
    const footYc = Math.floor((this.y + this.bodyH/2 - 2) / cs);
    const levelWithTarget = isWater || this.oasisTarget.y <= footYc + 4;
    // A committed descent overrides everything else until we truly land:
    // without the latch the walk branch re-aims at the target column
    // every frame and its occupant just paces the rim forever.
    if (this._descend && levelWithTarget) this._descend = false;
    if (this._descend) {
      if (!this.direction) this.direction = 1;
      this.state = STATES.WALK;
      this.vx = this.direction * C.walkSpeed * 0.9;
      return;
    }
    const ox = this.oasisTarget.x * cs + cs/2;
    const dx = ox - this.x;
    // greed is haste: the covetous hurry toward what they desire
    const zeal = 0.85 + 0.55 * this.greed;
    if (Math.abs(dx) > arriveDist) {
      this.state = STATES.WALK;
      this.direction = dx > 0 ? 1 : -1;
      const stepX = this.direction * C.walkSpeed * zeal;
      // hazard check on the intended path
      const aheadGX = Math.floor((this.x + stepX * 6) / cs);
      const footY = Math.floor((this.y + this.bodyH/2 - 2) / cs);
      let fireAhead = false, magmaAhead = false, waterAhead = false;
      for (let probe = -1; probe <= 2; probe++) {
        for (let row = -1; row <= 2; row++) {   // rows around foot level
          const t = engine.get(aheadGX + this.direction * probe, footY + row);
          if (t === P.FIRE) fireAhead = true;
          else if (t === P.MAGMA) magmaAhead = true;
          else if (t === P.WATER) waterAhead = true;
        }
      }
      if (waterAhead) {
        // water lies just ahead — this is the shore. Stop here and rest.
        this.state = STATES.IDLE;
        this.vx *= 0.5;
        return;
      }
      if ((fireAhead || magmaAhead) && this.greed < 0.7) {
        // too fearful to cross fire — hesitate at the edge
        this.state = STATES.IDLE;
        this.vx *= 0.5;
        return;
      }
      // walk on (and jump obstacles/pits like before)
      this.vx = stepX;
      if (!this.canMoveTo(engine, this.x + this.vx, this.y) && this.onGround(engine)) {
        this.vy = -2.8;
      } else if (chance(0.06) && this.onGround(engine)) {
        this.vy = -1.8; // occasional hop
      }
    } else if (!levelWithTarget) {
      // The greenery sits far below the feet (we stand on a ledge over
      // the grove's rim) — not arrived. Commit to stepping off the edge;
      // gravity will finish the journey. The heading we came by is kept.
      this._descend = true;
      if (!this.direction) this.direction = 1;
      this.state = STATES.WALK;
      this.vx = this.direction * C.walkSpeed * zeal;
    } else {
      // arrived among the coveted greenery — and greed breeds rivalry:
      // another soul eyeing the same patch may be challenged
      const crowd = this._samsara && this._samsara.figures;
      if (crowd && !(this._fightCd > 0) &&
          chance(CONFIG.stickFigures.fightChance)) {
        const rival = crowd.find(o => o !== this && !o.dead && !o.isLiberating &&
          o.oasisTarget && o.oasisTarget.type === this.oasisTarget.type &&
          dist2(o.x, o.y, this.x, this.y) <
            CONFIG.stickFigures.fightRange * CONFIG.stickFigures.fightRange);
        if (rival && this.startFightWith(rival)) return;
      }
      // rest contentedly among the greenery (or at the water's edge)
      this.state = STATES.IDLE;
      this.vx = 0;
    }
  }

  update(engine, wheels, samsara) {
    const C = CONFIG.stickFigures;
    if (this.dead) return;
    this._samsara = samsara;
    if (this.birthTimer > 0) this.birthTimer--;
    if (this._fightCd > 0) this._fightCd--;
    if (this.isLiberating) { this.updateLiberation(engine); return; }
    if (this.captured) {
      // position is controlled by fire wheel; just animate
      this.animTimer++;
      this.pullAmount = 1;
      this.beingPulled = true;
      return;
    }

    // decay pull if wheel didn't refresh it this frame
    if (!this.beingPulled) this.pullAmount = Math.max(0, this.pullAmount - 0.08);
    this.beingPulled = false;

    this.animTimer++;
    if (this.animTimer >= 30) { this.animTimer = 0; this.animFrame = (this.animFrame + 1) % 2; }

    // Precise body-column hazard probe — runs BEFORE any early return so
    // dragged or stunned figures cannot be ferried through molten rock.
    // Magma contact = instant death, always.
    const bodyHaz = this.probeBodyHazards(engine);
    if (bodyHaz.magma) { this.die(engine); return; }

    // Mouse drag overrides everything
    if (this.isDragged) {
      this.state = STATES.DRAGGED;
      return;
    }

    // Stun recovery
    if (this.stunTimer > 0) {
      this.stunTimer--;
      this.state = STATES.STUNNED;
      this.applyGravity(engine);
      return;
    }

    // Mid-brawl: the quarrel runs its own course until someone yields,
    // is parted by distance, or falls. Hazards above still claim them.
    if (this.state === STATES.FIGHT) {
      this.updateFight(engine);
      this.applyMovement(engine);
      return;
    }

    const env = this.sampleEnvironment(engine);

    // Magma contact = instant death (coarse sample + precise body column)
    if (env.magmaContact) {
      this.die(engine);
      return;
    }

    // Fire contact = lethal burning
    if (env.fireContact || bodyHaz.fire) {
      this.state = STATES.BURNING;
      this.burnTimer = 60;
      this.health -= 10;
      this.fleeFromThreat(engine);
      this.fearLevel = 1;
      if (this.health <= 0) { this.die(engine); return; }
    } else if (this.state === STATES.BURNING) {
      this.burnTimer = Math.max(0, this.burnTimer - 2);
      this.health -= 1;
      this.fleeFromThreat(engine);
      if (this.health <= 0) { this.die(engine); return; }
      if (this.burnTimer <= 0) this.state = STATES.IDLE;
    }

    // Drowning (liquid)
    if (env.liquidRatio > 0.5 && this.state !== STATES.BURNING) {
      this.state = STATES.DROWNING;
      this.happy = false;
      this.health -= 0.3;
      this.vy = -0.2;
      this.vx *= 0.9;
      if (this.health <= 0) { this.die(engine); return; }
    }
    // Burial (solid)
    else if (env.solidRatio > 0.7 && this.state !== STATES.BURNING) {
      this.state = STATES.BURIED;
      this.happy = false;
      this.health -= env.solidRatio > 0.9 ? 1 : 0.5;
      this.vx *= 0.5;
      if (this.health <= 0) { this.die(engine); return; }
    }
    // Normal AI
    else if (this.state !== STATES.BURNING) {
      const cs = CONFIG.grid.cellSize;
      // Fire wheels are feared universally — no temperament overrides this.
      if (this.detectWheelThreat(wheels)) {
        this.state = STATES.FLEE;
        this.happy = false;
        this.fleeFromThreat(engine);
      } else {
        // Whole-map plant sensing (throttled): every being feels where
        // greenery is, however far away.
        this._oasisTimer--;
        if (this._oasisTimer <= 0) {
          this._oasisTimer = 8;
          this.findOasis(engine);
        }
        // greed vs fear trade-off, resolved per individual
        const elemT = this.senseElementThreat(engine);
        const fearRangePx = Math.round(4 + (1 - this.greed) * 10) * cs;
        let fearStrength = 0;
        if (elemT) {
          const td = Math.sqrt(dist2(this.x, this.y, elemT.x*cs + cs/2, elemT.y*cs + cs/2));
          fearStrength = clamp(1 - td / fearRangePx, 0, 1);
          fearStrength *= fearStrength * (2 - this.greed); // terror grips the timid hardest
        }
        // a sensed sanctuary (grove or pond) exerts pull even from afar;
        // the greedy feel it as a hunger that fear must struggle to
        // outweigh — desire here outranks caution more often than not
        const plantPull = this.oasisTarget ? 0.55 + 0.75 * this.greed : 0;

        if (elemT && fearStrength > plantPull) {
          // fear wins — shrink away from the hazard
          this._threat = elemT;
          this.state = STATES.FLEE;
          this.happy = false;
          this.fleeFromThreat(engine);
        } else if (this.oasisTarget) {
          // greed (or simple curiosity) draws them toward the greenery or shore
          this.approachOasis(engine);
          this.happy = true;
        } else {
          this.updateAI(engine, env, wheels);
          this.happy = this.checkWaterMood(engine, env);
        }
      }
    }

    // Apply movement
    this.applyMovement(engine);

    // Fear / safety tracking for liberation
    let nearWheel = false;
    for (const w of wheels) {
      if (w.active && dist2(this.x,this.y,w.x,w.y) < 200*200) { nearWheel = true; break; }
    }
    if (env.fireContact || env.magmaContact || nearWheel) {
      this.safeTimer = 0;
      this.fearLevel = Math.min(1, this.fearLevel + 0.05);
    } else {
      this.safeTimer++;
      this.fearLevel = Math.max(0, this.fearLevel - 0.01);
    }

    if (this.state === STATES.IDLE) this.idleTimer++;
    else this.idleTimer = 0;

    // Liberation check
    if (!this.isLiberating && samsara.liberationCount < CONFIG.stickFigures.maxLiberationsPerCycle) {
      if (this.idleTimer > CONFIG.stickFigures.liberationIdleFrames &&
          this.safeTimer > CONFIG.stickFigures.liberationSafeFrames &&
          chance(CONFIG.stickFigures.liberationChance)) {
        this.beginLiberation();
      }
    }
  }

  updateAI(engine, env, wheels) {
    const C = CONFIG.stickFigures;

    // Climb state maintenance
    if (this.state === STATES.CLIMB) {
      if (this.onGround(engine) || !env.plantContact || this.y < 30) {
        this.state = STATES.WALK;
        this.vy = 0;
      } else {
        this.vy = -C.climbSpeed;
        return;
      }
    }

    // Survivor: detect threats (any wheel)
    if (this.persona === PERSONAS.SURVIVOR) {
      for (const wheel of wheels) {
        if (!wheel.active) continue;
        const d = Math.sqrt(dist2(this.x, this.y, wheel.x, wheel.y));
        if (d < 150) {
          this.state = STATES.FLEE;
          const ang = Math.atan2(this.y - wheel.y, this.x - wheel.x);
          this.direction = Math.cos(ang) >= 0 ? 1 : -1;
          this.vx = this.direction * C.fleeSpeed;
          return;
        }
      }
    }

    // Seeker: walk toward nearest edge
    if (this.persona === PERSONAS.SEEKER) {
      this.state = STATES.WALK;
      const distLeft = this.x;
      const distRight = (engine.w * CONFIG.grid.cellSize) - this.x;
      this.direction = distLeft < distRight ? -1 : 1;
      this.vx = this.direction * C.walkSpeed;
      return;
    }

    // Turn timer
    this.turnTimer--;
    if (this.turnTimer <= 0) {
      this.turnTimer = randRange(C.turnDelayMin, C.turnDelayMax);
      if (this.persona === PERSONAS.APATHETIC) {
        if (chance(0.8)) { this.state = STATES.IDLE; this.vx = 0; }
        else { this.direction *= -1; this.state = STATES.WALK; }
      } else if (this.persona === PERSONAS.RESTLESS) {
        this.direction *= -1;
        this.state = STATES.WALK;
      } else {
        this.state = chance(0.5) ? STATES.IDLE : STATES.WALK;
      }
    }

    // Persona behavior
    if (this.persona === PERSONAS.APATHETIC) {
      if (this.state === STATES.IDLE && chance(0.005)) {
        this.state = STATES.WALK;
        this.vx = this.direction * C.baseSpeed;
      } else if (this.state === STATES.WALK && chance(0.02)) {
        this.state = STATES.IDLE; this.vx = 0;
      }
    } else if (this.persona === PERSONAS.RESTLESS) {
      if (this.state === STATES.IDLE) { this.state = STATES.WALK; }
    }

    if (this.state === STATES.WALK || this.state === STATES.FLEE) {
      this.vx = this.direction * (this.state === STATES.FLEE ? C.fleeSpeed : C.walkSpeed);
    } else if (this.state === STATES.IDLE) {
      this.vx *= 0.8;
    }

    // Plant climbing
    if (env.plantContact && !this.onGround(engine) && chance(0.1)) {
      this.state = STATES.CLIMB;
      this.vy = -C.climbSpeed;
    }
  }

  applyGravity(engine) {
    if (!this.onGround(engine)) {
      this.vy += 0.15;
      this.vy = Math.min(this.vy, 4);
    } else {
      this.vy = 0;
    }
    this.y += this.vy;
    // ground clamp
    const cs = CONFIG.grid.cellSize;
    const footY = Math.floor((this.y + this.bodyH/2) / cs);
    if (footY >= engine.h - 1) {
      this.y = (engine.h - 1) * cs - this.bodyH/2;
      this.vy = 0;
    }
  }

  // --- FIGHTS -----------------------------------------------------------
  // Greed breeds rivalry: when two souls covet the same greenery (or
  // jostle in the same panic-flight), blows are exchanged. Most quarrels
  // end with shoves and bruised pride; rarely, one falls — and the wheel
  // of rebirth turns for them as for all.
  startFightWith(rival) {
    const C = CONFIG.stickFigures;
    if ((this._fightCd > 0) || (rival._fightCd > 0)) return false;
    if (rival.dead || rival.isLiberating || rival.captured ||
        rival.state === STATES.FIGHT || rival.state === STATES.STUNNED) return false;
    this.state = STATES.FIGHT;
    rival.state = STATES.FIGHT;
    this._rival = rival;
    rival._rival = this;
    const dur = 80 + rand(70);
    this._fightTimer = dur;
    rival._fightTimer = dur;
    this.direction = rival.x >= this.x ? 1 : -1;
    rival.direction = -this.direction;
    this.vx = 0; rival.vx = 0;
    return true;
  }

  updateFight(engine) {
    const r = this._rival;
    if (this._fightFlash > 0) this._fightFlash--;
    if (!r || r.dead || r.state !== STATES.FIGHT || r._rival !== this ||
        dist2(this.x, this.y, r.x, r.y) > 44 * 44) {
      this.endFight();
      return;
    }
    this._fightTimer--;
    if (this._fightTimer <= 0) { this.endFight(); return; }
    // face the foe
    this.direction = r.x >= this.x ? 1 : -1;
    // exchange blows — lunges, shoves, desperate little leaps
    if (chance(0.12)) {
      const lunge = chance(0.5) ? 1 : -1;
      this.vx = lunge * 1.1;
      r.vx = -lunge * 0.7;
      if (chance(0.35)) this.vy = -1.7;
      this._fightFlash = 5;
      // a landed blow draws a spark of pain
      if (chance(0.4) && r.stunTimer <= 0) {
        r.health -= 6;
        r._fightFlash = 5;
        if (r.health <= 0 && !r.dead) {
          r.die(engine);
          this.endFight();
          return;
        }
      }
    } else {
      this.vx *= 0.7;
    }
    // very rarely the quarrel turns lethal outright — 轮回 awaits
    if (chance(0.0012)) {
      this.die(engine);
      return;
    }
  }

  endFight() {
    if (this.state !== STATES.FIGHT) return;
    this.state = STATES.WALK;
    this._fightCd = CONFIG.stickFigures.fightCooldown;
    this._rival = null;
    // the loser's appetite cools: seek greener ground elsewhere
    this.oasisTarget = null;
    this._oasisTimer = 30;
    this.vx = this.direction * CONFIG.stickFigures.walkSpeed * 0.6;
  }

  applyMovement(engine) {
    const cs = CONFIG.grid.cellSize;
    // Vertical movement
    if (this.state === STATES.DROWNING || this.state === STATES.CLIMB || this.state === STATES.ASCENDING) {
      this.y += this.vy;
    } else {
      this.applyGravity(engine);
    }

    // Horizontal
    if (this.vx !== 0) {
      const nx = this.x + this.vx;
      let moved = false;
      // Souls press onward up slopes no timid walker would dare: try the
      // level path first, then ever taller steps — anything short of a
      // sheer wall (~80°) can be scaled.
      for (const lift of [0, cs, cs * 2, cs * 3]) {
        if (this.canMoveTo(engine, nx, this.y - lift)) {
          this.x = nx;
          this.y -= lift;
          moved = true;
          break;
        }
      }
      if (!moved) {
        // truly walled in — leap at it before surrendering ground
        if (this.onGround(engine)) {
          this.vy = -2.8;
          if (++this._blocked > 24) {
            this._blocked = 0;
            this.direction *= -1;
            this.vx = 0;
          }
        } else {
          this.direction *= -1;
          this.vx = 0;
          this._blocked = 0;
        }
      } else {
        this._blocked = 0;
      }
    }

    // Clamp to world
    this.x = clamp(this.x, this.bodyW, engine.w * cs - this.bodyW);
    this.y = clamp(this.y, this.bodyH, engine.h * cs - this.bodyH);
  }

  beginLiberation() {
    this.isLiberating = true;
    this.libStage = 0;
    this.libTimer = 0;
    this.state = STATES.ASCENDING;
    this.vx = 0; this.vy = 0;
    this.libParticles = [];
    this.libAura = 0;
  }

  updateLiberation(engine) {
    this.libTimer++;
    const C = CONFIG.stickFigures;

    if (this.libStage === 0) {
      // stillness — settles into meditation
      this.libAura = Math.min(1, this.libAura + 0.02);
      if (this.libTimer > 75) { this.libStage = 1; this.libTimer = 0; }
    } else if (this.libStage === 1) {
      // transmutation — golden glow intensifies, aura grows
      this.libAura = Math.min(1.5, this.libAura + 0.01);
      // emit rising sparkles
      if (this.libTimer % 3 === 0) {
        this.libParticles.push({
          x: randRange(-6, 6), y: randRange(-4, 4),
          vx: randRange(-0.3, 0.3), vy: randRange(-1.5, -0.5),
          life: 40 + rand(30), maxLife: 70,
          size: randRange(0.8, 2)
        });
      }
      if (this.libTimer > 150) { this.libStage = 2; this.libTimer = 0; }
    } else if (this.libStage === 2) {
      // ascension — slow, contemplative rise to the top of the world,
      // unhurried enough for the player to witness
      const accel = 0.03;
      this.vy = Math.max(-2.4, this.vy - accel);
      this.y += this.vy;
      this.libAura = Math.min(2.5, this.libAura + 0.01);
      // reached the top — no burst: the being simply passes through,
      // carried by the beam until it leaves the world entirely
      if (this.y < -this.bodyH * 2) {
        this.liberated = true;
        this.dead = true;
        this.isLiberating = false;
        // even transcendence keeps the wheel turning: one soul departs,
        // another awakens below
        if (this._samsara) this._samsara.rebirthQueue++;
      }
    }

    // update liberation particles
    for (let i = this.libParticles.length - 1; i >= 0; i--) {
      const p = this.libParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy -= 0.02; // drift upward
      p.life--;
      if (p.life <= 0) this.libParticles.splice(i, 1);
    }
  }

  die(engine) {
    this.dead = true;
    this.captured = false;
    this.capturedBy = null;
    // convert to ash at position
    const cs = CONFIG.grid.cellSize;
    const gx = this.gridX, gy = this.gridY;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if (engine.inBounds(gx+dx, gy+dy) && engine.get(gx+dx, gy+dy) === P.EMPTY) {
          engine.set(gx+dx, gy+dy, P.ASH);
        }
      }
    }
    // 轮回 — the wheel turns at once: a new soul will kindle elsewhere
    // this very frame. Death here is a change of place, not an end.
    if (this._samsara) this._samsara.rebirthQueue++;
  }

  render(ctx) {
    if (this.dead && !this.isLiberating) return;
    ctx.save();
    ctx.translate(this.x, this.y);

    let color = "#f0f0f0";
    let alpha = 1;

    if (this.isLiberating) {
      if (this.libStage === 1) {
        // transmutation: white → gold
        const t = clamp(this.libTimer / 150, 0, 1);
        color = `rgb(${Math.floor(lerp(240,255,t))},${Math.floor(lerp(240,220,t))},${Math.floor(lerp(240,90,t))})`;
      } else if (this.libStage >= 2) {
        // ascension: bright white-gold, intensifying
        const t = clamp(this.libTimer / 240, 0, 1);
        color = `rgb(255,${Math.floor(lerp(230,250,t))},${Math.floor(lerp(120,180,t))})`;
      }
    } else if (this.state === STATES.BURNING) {
      color = "#FF5533";
    } else if (this.state === STATES.DROWNING) {
      color = "#6AB0F0";
    } else if (this.state === STATES.BURIED) {
      color = "#b0a080";
    } else if (this.state === STATES.FIGHT) {
      // blood up: a hot, quarrelsome hue
      color = this._fightFlash > 0 ? "#FFFFFF" : "#FF9977";
    }

    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = this.isLiberating && this.libStage >= 1 ? 2 : 1.5;
    ctx.lineCap = "round";
    if (this.isLiberating && this.libStage >= 1) {
      ctx.shadowColor = "rgba(255,245,200,0.7)";
      ctx.shadowBlur = 4 + this.libAura * 2;
    }

    // === 投胎 birth-light — a newborn soul shimmers briefly: a soft
    // jade ring contracts around it while pale motes spiral upward.
    // Noticeable, but far quieter than the gold of ascension. ===
    if (this.birthTimer > 0 && !this.isLiberating) {
      const t = this.birthTimer / 60;              // 1 → 0
      const rr = 4 + (1 - t) * 20;
      ctx.save();
      ctx.strokeStyle = `rgba(150,255,215,${(t * 0.65).toFixed(3)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = `rgba(210,255,238,${(t * 0.85).toFixed(3)})`;
      for (let k = 0; k < 5; k++) {
        const a = (k / 5) * Math.PI * 2 + this.birthTimer * 0.14;
        const mx = Math.cos(a) * rr * 0.55;
        const my = Math.sin(a) * rr * 0.55 - (1 - t) * 16;
        ctx.fillRect(mx, my, 1.6, 1.6);
      }
      ctx.restore();
    }

    const headR = 3;
    const torsoTop = -this.bodyH/2 + headR*2;
    const torsoBot = this.bodyH/2 - 6;
    const hipY = torsoBot;

    // === Liberation marks — a quiet column of heaven's light descends
    // from the top of the world onto the being: a passage, not a blast.
    // Drawn beneath the figure so its silhouette stays clearly visible. ===
    if (this.isLiberating) {
      // beam intensity: fades in through stillness & transmutation,
      // holds steady through the ascent; gentle breathing pulse
      const pulse = 0.04 * Math.sin(this.libTimer * 0.06);
      const beamA = this.libStage === 0
        ? Math.min(0.30, this.libAura * 0.3)
        : this.libStage === 1
          ? Math.min(0.38, 0.18 + this.libAura * 0.14)
          : 0.42 + pulse;
      const halfW = 16 + this.libAura * 5;
      const topY = Math.min(-this.y, 0) - 4;   // always reach the screen top
      const botY = 26;
      const grad = ctx.createLinearGradient(-halfW, 0, halfW, 0);
      grad.addColorStop(0, "rgba(255,246,214,0)");
      grad.addColorStop(0.32, `rgba(255,246,214,${beamA * 0.55})`);
      grad.addColorStop(0.5, `rgba(255,252,240,${beamA})`);
      grad.addColorStop(0.68, `rgba(255,246,214,${beamA * 0.55})`);
      grad.addColorStop(1, "rgba(255,246,214,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(-halfW, topY, halfW * 2, botY - topY);

      // soft light pooling where the beam meets the figure
      ctx.globalAlpha = alpha * (this.libStage >= 2 ? 0.5 : 0.3);
      ctx.fillStyle = "rgba(255,250,230,0.5)";
      ctx.beginPath();
      ctx.ellipse(0, 14, halfW * 0.9, 5, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = alpha;

      // the being grows as it transcends
      const grow = 1 + Math.min(0.6, this.libAura * 0.3 + (this.libStage >= 2 ? 0.15 : 0));
      ctx.scale(grow, grow);

      // thin white circle around the whole figure
      const ringR = this.bodyH * 0.55 + this.libAura * 3;
      ctx.strokeStyle = `rgba(255,255,255,${0.75 * Math.min(1, this.libAura)})`;
      ctx.lineWidth = 1.5 / grow;
      ctx.beginPath();
      ctx.arc(0, -1, ringR, 0, Math.PI*2);
      ctx.stroke();

      // second, fainter concentric ring at full ascension
      if (this.libStage >= 2) {
        const prevAlpha = ctx.globalAlpha;
        ctx.globalAlpha = prevAlpha * 0.45;
        ctx.beginPath();
        ctx.arc(0, -1, ringR * 1.22, 0, Math.PI*2);
        ctx.stroke();
        ctx.globalAlpha = prevAlpha;
      }

      // modest glow on the strokes only
      ctx.shadowColor = "rgba(255,250,220,0.8)";
      ctx.shadowBlur = 5;
    }

    // Struggle: body jitter when in danger
    const struggling = this.beingPulled || this.captured ||
      this.state === STATES.BURNING || this.state === STATES.BURIED || this.state === STATES.DROWNING;
    if (struggling) {
      ctx.translate(randRange(-0.8, 0.8), randRange(-0.8, 0.8));
      ctx.rotate(randRange(-0.06, 0.06));
    } else if (this.happy) {
      // gentle happy bounce
      ctx.translate(0, Math.abs(Math.sin(this.animTimer * 0.35)) * -1.2);
    }

    // Head
    ctx.beginPath();
    ctx.arc(0, -this.bodyH/2 + headR, headR, 0, Math.PI*2);
    ctx.fill();

    // Torso (wobbles when struggling)
    ctx.beginPath();
    if (struggling) {
      const wob = Math.sin(this.animTimer * 0.9) * 1.5;
      ctx.moveTo(wob * 0.3, torsoTop);
      ctx.lineTo(-wob * 0.5, torsoBot);
    } else {
      ctx.moveTo(0, torsoTop);
      ctx.lineTo(0, torsoBot);
    }
    ctx.stroke();

    // Limbs
    if (this.isLiberating) {
      // lotus position: crossed legs
      ctx.beginPath();
      ctx.moveTo(-4, hipY);
      ctx.quadraticCurveTo(-7, hipY + 3, -1, hipY + 5);
      ctx.moveTo(4, hipY);
      ctx.quadraticCurveTo(7, hipY + 3, 1, hipY + 5);
      ctx.stroke();
      // meditation mudra: hands resting on lap, palms up, touching
      ctx.beginPath();
      ctx.moveTo(0, torsoTop + 5);
      ctx.lineTo(-3, hipY - 1);
      ctx.moveTo(0, torsoTop + 5);
      ctx.lineTo(3, hipY - 1);
      ctx.stroke();
    } else if (this.pullAmount > 0.05) {
      const ang = Math.atan2(this.pullY - this.y, this.pullX - this.x);
      const s = 10 * this.pullAmount;
      const spread = 0.35;
      // struggle spasm added on top of stretch
      const spasm = struggling ? Math.sin(this.animTimer * 1.2) * 3 : 0;
      ctx.beginPath();
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(Math.cos(ang - spread) * (7 + s + spasm), torsoTop + 2 + Math.sin(ang - spread) * (7 + s + spasm));
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(Math.cos(ang + spread) * (7 + s - spasm), torsoTop + 2 + Math.sin(ang + spread) * (7 + s - spasm));
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, hipY);
      ctx.lineTo(Math.cos(ang - spread*0.7) * (5 + s*0.8 + spasm*0.7), hipY + Math.sin(ang - spread*0.7) * (5 + s*0.8 + spasm*0.7));
      ctx.moveTo(0, hipY);
      ctx.lineTo(Math.cos(ang + spread*0.7) * (5 + s*0.8 - spasm*0.7), hipY + Math.sin(ang + spread*0.7) * (5 + s*0.8 - spasm*0.7));
      ctx.stroke();
      // faint pull line to wheel
      if (this.pullAmount > 0.3) {
        ctx.globalAlpha = alpha * 0.2 * this.pullAmount;
        ctx.strokeStyle = "#FF6600";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.pullX - this.x, this.pullY - this.y);
        ctx.stroke();
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
      }
    } else if (struggling) {
      // fast, large-amplitude struggle spasms
      const t = this.animTimer * 1.1;
      const armA = Math.sin(t) * 0.9;
      const armB = Math.sin(t + 1.5) * 0.9;
      const legA = Math.sin(t * 0.8 + 0.5) * 0.8;
      const legB = Math.sin(t * 0.8 + 2.0) * 0.8;
      ctx.beginPath();
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(-6 + armA * 5, torsoTop + 4 + Math.abs(armA) * 3);
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(6 + armB * 5, torsoTop + 4 + Math.abs(armB) * 3);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, hipY);
      ctx.lineTo(-4 + legA * 4, hipY + 4 + legA * 3);
      ctx.moveTo(0, hipY);
      ctx.lineTo(4 + legB * 4, hipY + 4 + legB * 3);
      ctx.stroke();
    } else if (this.state === STATES.FLEE) {
      // panicked flee: hands up / on head, fast legs
      const t = this.animTimer * 0.5;
      const legSwing = Math.sin(t) * 0.8;
      // hands on head (alternating with hands up)
      const panic = Math.sin(this.animTimer * 0.4);
      ctx.beginPath();
      if (panic > 0) {
        // hands on head
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(-3, -this.bodyH/2 + headR - 1);
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(3, -this.bodyH/2 + headR - 1);
      } else {
        // hands up in air
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(-4 + Math.sin(t)*2, torsoTop - 6);
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(4 + Math.cos(t)*2, torsoTop - 6);
      }
      ctx.stroke();
      // fast running legs
      ctx.beginPath();
      ctx.moveTo(0, hipY);
      ctx.lineTo(-3 + legSwing * 4, hipY + 5);
      ctx.moveTo(0, hipY);
      ctx.lineTo(3 - legSwing * 4, hipY + 7);
      ctx.stroke();
    } else if (this.happy) {
      // happy: relaxed open arms, light bouncy step
      const t = this.animTimer * 0.3;
      if (this.state === STATES.WALK) {
        // arms slightly out, gentle swing
        ctx.beginPath();
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(-6, torsoTop + 4 + Math.sin(t) * 2);
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(6, torsoTop + 4 - Math.sin(t) * 2);
        ctx.stroke();
        // light steps
        ctx.beginPath();
        ctx.moveTo(0, hipY);
        ctx.lineTo(-2 + Math.sin(t) * 3, hipY + 5);
        ctx.moveTo(0, hipY);
        ctx.lineTo(2 - Math.sin(t) * 3, hipY + 5);
        ctx.stroke();
      } else {
        // idle happy: arms relaxed out, gentle sway
        const sway = Math.sin(t * 0.5) * 1.5;
        ctx.beginPath();
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(-5 + sway, torsoTop + 5);
        ctx.moveTo(0, torsoTop + 2);
        ctx.lineTo(5 - sway, torsoTop + 5);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, hipY);
        ctx.lineTo(-2, hipY + 6);
        ctx.moveTo(0, hipY);
        ctx.lineTo(2, hipY + 6);
        ctx.stroke();
      }
    } else {
      // normal animated limbs
      let armSwing = 0, legSwing = 0;
      if (this.state === STATES.WALK) {
        armSwing = Math.sin(this.animTimer * 0.3) * 0.5;
        legSwing = Math.sin(this.animTimer * 0.3) * 0.6;
      } else if (this.state === STATES.DRAGGED) {
        armSwing = 0.3; legSwing = 0.2;
      }
      ctx.beginPath();
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(-5, torsoTop + 6 + armSwing * 4);
      ctx.moveTo(0, torsoTop + 2);
      ctx.lineTo(5, torsoTop + 6 - armSwing * 4);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, hipY);
      ctx.lineTo(-3 + legSwing * 3, hipY + 6);
      ctx.moveTo(0, hipY);
      ctx.lineTo(3 - legSwing * 3, hipY + 6);
      ctx.stroke();
    }

    // Liberation particles (soft white-gold sparkles)
    if (this.isLiberating && this.libParticles) {
      for (const p of this.libParticles) {
        const a = clamp(p.life / p.maxLife, 0, 1);
        ctx.fillStyle = `rgba(255,250,${Math.floor(200 + 55*a)},${a})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, Math.PI*2);
        ctx.fill();
      }
    }

    ctx.restore();
  }
}

// ============================================================
// 5. FIRE WHEEL
// ============================================================
class FireWheel {
  constructor() {
    this.active = false;
    this.x = 640; this.y = 360;
    this.radius = 0;
    this.targetRadius = 0;
    this.rotation = 0;
    this.state = "idle"; // idle, spawning, active, exploding, dissipating
    this.isDragging = false;
    this.dragTimer = 0;
    this.wanderTarget = { x: 640, y: 360 };
    this.wanderPause = 0;
    this.absorbedCount = 0;
    this.flameParticles = [];
    this.autoSpawnTimer = CONFIG.fireWheel.autoSpawnInterval;
    this.maxRadius = 734; // set dynamically in update
  }

  spawn(x, y) {
    this.active = true;
    this.x = x; this.y = y;
    this.radius = 5;
    this.targetRadius = CONFIG.fireWheel.initialRadius;
    this.state = "spawning";
    this.absorbedCount = 0;
    this.flameParticles = [];
  }
